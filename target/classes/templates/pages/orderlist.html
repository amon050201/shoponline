<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 线上购物与交易系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar desktop-nav">
    <div class="nav-container">
        <a href="/" class="nav-brand">线上购物与交易系统</a>
        <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <ul class="nav-menu">
            <li class="nav-item"><a href="/product/list">商品列表</a></li>
            <li class="nav-item"><a href="/cart/view">购物车</a></li>
            <li class="nav-item active"><a href="/order/list">我的订单</a></li>
            <li class="nav-item"><a href="/address/list">收货地址</a></li>
            <li class="nav-item"><a href="/logout">退出</a></li>
        </ul>
    </div>
</div>

<!-- 移动端下拉菜单 -->
<div class="mobile-dropdown" id="mobileDropdown">
    <a href="/">首页</a>
    <a href="/product/list">商品列表</a>
    <a href="/cart/view">购物车</a>
    <a href="/order/list">我的订单</a>
    <a href="/address/list">收货地址</a>
    <a href="/exchange/market">以物易物</a>
    <a href="/logout">退出登录</a>
</div>

<div class="container">
    <h2>我的订单</h2>

    <div th:if="${orders != null and !orders.isEmpty()}">
        <div th:each="order : ${orders}" class="order-card">
            <div class="order-header">
                <div class="order-info">
                    <span>订单号：<strong th:text="${order.orderNo}">-</strong></span>
                    <span th:text="${#temporals.format(order.createdTime, 'yyyy-MM-dd HH:mm')}">-</span>
                    <span th:if="${order.shippingCompany}">🚚 <span th:text="${order.shippingCompany}"></span>：<span th:text="${order.trackingNumber}"></span></span>
                </div>
                <span class="order-status" th:classappend="'status-' + ${order.status}"
                      th:text="${order.status == 0 ? '待支付' : order.status == 1 ? '已支付' :
                               order.status == 2 ? '已发货' : order.status == 3 ? '已完成' :
                               order.status == 4 ? '已取消' : '未知'}">状态</span>
            </div>

            <div class="order-items">
                <div th:each="item : ${order.orderItems}" class="order-item">
                    <div class="item-icon">📦</div>
                    <div class="item-details">
                        <div class="item-name" th:text="${item.productName}">商品</div>
                        <div class="item-meta">¥<span th:text="${item.price}">0.00</span> × <span th:text="${item.quantity}">1</span></div>
                    </div>
                    <div style="font-weight: bold; color: #e74c3c;">¥<span th:text="${item.totalPrice}">0.00</span></div>
                </div>
            </div>

            <div class="order-footer">
                <div class="order-total">
                    合计：<span class="total-amount">¥<span th:text="${order.totalAmount}">0.00</span></span>
                </div>
                <div class="order-actions" style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn btn-secondary" th:onclick="'location.href=\'/order/detail/' + ${order.id} + '\''">查看详情</button>
                    <button th:if="${order.status == 0}" class="btn btn-primary" th:onclick="'payOrder(' + ${order.id} + ')'">立即支付</button>
                    <button th:if="${order.status == 0}" class="btn btn-danger" th:onclick="'cancelOrder(' + ${order.id} + ')'">取消</button>
                    <button th:if="${order.status == 2}" class="btn btn-success" th:onclick="'confirmReceive(' + ${order.id} + ')'">确认收货</button>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${orders == null or orders.isEmpty()}" class="empty-orders">
        <div class="icon">📋</div>
        <h3 style="color: #666;">暂无订单</h3>
        <p>您还没有下过订单，快去选购心仪的商品吧！</p>
        <a href="/product/list" class="btn btn-primary" style="padding: 12px 30px; text-decoration: none; display: inline-block;">去购物</a>
    </div>
</div>

<!-- 支付弹窗 -->
<div id="payModal" class="modal">
    <div class="modal-content" id="payModalContent" style="text-align: center;">
        <!-- 步骤1: 选择支付方式 -->
        <div id="payStep1">
            <h3>选择支付方式</h3>
            <div style="margin: 20px 0;">
                <button class="btn btn-primary" onclick="createPayment('alipay')" style="padding: 12px 25px;">支付宝</button>
                <button class="btn" onclick="createPayment('wechat')" style="padding: 12px 25px; background: linear-gradient(135deg, #07C, #059); color: #fff;">微信支付</button>
            </div>
            <button class="btn btn-secondary" onclick="closePayModal()" style="width: 100%;">取消</button>
        </div>

        <!-- 步骤2: 展示二维码 + 模拟支付 -->
        <div id="payStep2" style="display:none;">
            <h3>扫码支付</h3>
            <div style="margin: 15px 0;">
                <img id="qrCodeImg" src="" alt="支付二维码" style="width: 200px; height: 200px; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            <p style="color: #666; font-size: 14px;">请使用<span id="payMethodLabel">支付宝</span>扫码完成支付</p>
            <p style="font-size: 12px; color: #999;">演示模式：点击下方按钮模拟支付成功</p>
            <button class="btn btn-success" onclick="simulatePayment()" style="padding: 12px 30px; margin-top: 10px;">模拟支付成功</button>
            <button class="btn btn-secondary" onclick="closePayModal()" style="width: 100%; margin-top: 10px;">取消支付</button>
        </div>
    </div>
</div>

<script>
    var currentOrderId = null;
    var currentOrderNo = null;
    var currentTransactionId = null;

    function payOrder(orderId) {
        currentOrderId = orderId;
        document.getElementById('payStep1').style.display = 'block';
        document.getElementById('payStep2').style.display = 'none';
        document.getElementById('payModal').classList.add('active');
    }

    function createPayment(method) {
        if (!currentOrderId) return;
        var label = method === 'alipay' ? '支付宝' : '微信支付';
        document.getElementById('payMethodLabel').textContent = label;

        fetch('/api/payment/create?orderId=' + currentOrderId + '&paymentMethod=' + method, { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) {
                currentOrderNo = data.data.orderNo;
                currentTransactionId = data.data.transactionId;
                document.getElementById('qrCodeImg').src = data.data.qrCodeUrl;
                document.getElementById('payStep1').style.display = 'none';
                document.getElementById('payStep2').style.display = 'block';
            } else {
                alert(data.message);
            }
        })
        .catch(function() { alert('创建支付失败'); });
    }

    function simulatePayment() {
        if (!currentOrderNo || !currentTransactionId) return;
        fetch('/api/payment/callback?orderNo=' + currentOrderNo + '&transactionId=' + currentTransactionId, { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            alert(data.message);
            closePayModal();
            if (data.success) location.reload();
        })
        .catch(function() { alert('支付回调失败'); });
    }

    function closePayModal() {
        document.getElementById('payModal').classList.remove('active');
        currentOrderId = null;
        currentOrderNo = null;
        currentTransactionId = null;
    }

    function cancelOrder(orderId) {
        if (!confirm('确定取消该订单？')) return;
        fetch('/order/cancel/' + orderId, { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            alert(data.message);
            if (data.success) location.reload();
        });
    }

    function confirmReceive(orderId) {
        if (!confirm('确认已收到商品？')) return;
        fetch('/order/receive/' + orderId, { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            alert(data.message);
            if (data.success) location.reload();
        });
    }

    function toggleMobileMenu() {
        var menu = document.getElementById('mobileDropdown');
        if (menu) menu.classList.toggle('show');
    }
    document.addEventListener('DOMContentLoaded', function() {
        var menu = document.getElementById('mobileDropdown');
        if (!menu) return;
        document.addEventListener('click', function(e) {
            if (e.target.closest('.hamburger-btn')) return;
            if (!e.target.closest('.mobile-dropdown')) menu.classList.remove('show');
        });
    });
</script>

<!-- 移动端底部导航 -->
<div class="mobile-bottom-nav">
    <div class="nav-items">
        <a href="/" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>首页</span>
        </a>
        <a href="/product/list" class="nav-item">
            <span class="nav-icon">📦</span>
            <span>商品</span>
        </a>
        <a href="/cart/view" class="nav-item">
            <span class="nav-icon">🛒</span>
            <span>购物车</span>
        </a>
        <a href="/order/list" class="nav-item active">
            <span class="nav-icon">📋</span>
            <span>订单</span>
        </a>
        <a href="/" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>我的</span>
        </a>
    </div>
</div>
</body>
</html>
