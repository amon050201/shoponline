# ============================================
# Production Profile
# Activate: --spring.profiles.active=prod
# ============================================

# Redis Cache
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3000ms
spring.cache.redis.time-to-live=300000
spring.cache.redis.key-prefix=demo1:
spring.cache.redis.cache-null-values=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# Elasticsearch
spring.elasticsearch.enabled=true
spring.elasticsearch.uris=${ES_URIS:http://localhost:9200}
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s

# Payment
payment.demo-mode=false

# Logging
logging.level.com.qzy.springbootlogin=INFO
logging.level.org.springframework.web=WARN
