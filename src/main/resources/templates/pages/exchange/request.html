<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发起交换 - 线上购物与交易系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>发起交换请求</h1>
        </div>

        <div class="content">
            <div class="card">
                <div class="card-title">您想要的商品</div>
                <div class="product-info">
                    <div class="product-name" th:text="${targetProduct.name}">商品名称</div>
                    <div class="product-price">¥<span th:text="${targetProduct.price}">0.00</span></div>
                    <div id="target-valuation" style="margin-top:10px;padding:8px;background:#f0f4ff;border-radius:6px;font-size:13px;display:none;"></div>
                </div>

                <div class="form-group">
                    <label>您的收货地址</label>
                    <input type="text" id="receiverAddress" placeholder="请输入您的收货地址">
                </div>

                <div class="form-group">
                    <label>备注信息（可选）</label>
                    <textarea id="remark" rows="3" placeholder="请输入备注信息"></textarea>
                </div>
            </div>

            <div class="card">
                <div class="card-title">选择您要交换的商品</div>

                <div class="form-group">
                    <label>从以下商品中选择</label>
                    <select id="myProductId">
                        <option value="">请选择商品</option>
                        <option th:each="product : ${myProducts}"
                                th:value="${product.id}"
                                th:text="${product.name + ' (¥' + product.price + ')'}">
                        </option>
                        <option value="custom">🖊️ 手动输入我的商品...</option>
                    </select>
                </div>

                <!-- 手动输入商品 -->
                <div id="customProductForm" style="display:none;padding:12px;background:#fff8e1;border-radius:8px;margin-bottom:12px;">
                    <div class="form-group">
                        <label>商品名称 *</label>
                        <input type="text" id="customName" placeholder="例如：九成新iPhone 15 Pro">
                    </div>
                    <div class="form-group">
                        <label>估价 (¥)</label>
                        <input type="number" id="customPrice" placeholder="您期望的价值" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label>品牌</label>
                        <input type="text" id="customBrand" placeholder="例如：Apple">
                    </div>
                    <div class="form-group">
                        <label>成色</label>
                        <select id="customCondition">
                            <option value="like-new">全新</option>
                            <option value="good" selected>良好</option>
                            <option value="fair">一般</option>
                            <option value="poor">较差</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>商品描述</label>
                        <textarea id="customDesc" rows="2" placeholder="描述一下您的商品..."></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <label>对方收货地址</label>
                    <input type="text" id="initiatorAddress" placeholder="请输入对方的收货地址">
                </div>

                <div id="my-valuation" style="margin-top:10px;padding:8px;background:#f0f4ff;border-radius:6px;font-size:13px;display:none;"></div>

                <div id="recommended-diff" style="margin-top:10px;padding:10px;background:#fff8e1;border-radius:6px;font-size:14px;display:none;text-align:center;font-weight:bold;"></div>

                <div class="price-diff" id="priceDiffBox" style="display: none;">
                    <h3>差价计算（按标价）</h3>
                    <div class="amount" id="priceDiffAmount">¥0.00</div>
                    <p id="priceDiffText">选择商品后自动计算</p>
                </div>

                <button class="btn-submit" onclick="submitExchange()">提交交换请求</button>
                <a href="/exchange/market" class="btn-back">返回市场</a>
            </div>
        </div>
    </div>

    <script>
        const targetPrice = [[${targetProduct.price}]];
        const targetProductId = [[${targetProduct.id}]];
        const receiverId = [[${targetProduct.merchantId != null ? targetProduct.merchantId : 1}]];
        let aiValuations = {};

        document.getElementById('myProductId').addEventListener('change', function() {
            var isCustom = this.value === 'custom';
            document.getElementById('customProductForm').style.display = isCustom ? 'block' : 'none';
            document.getElementById('priceDiffBox').style.display = isCustom ? 'none' : 'block';
            document.getElementById('recommended-diff').style.display = 'none';
            document.getElementById('my-valuation').style.display = 'none';
            if (!isCustom) { calculatePriceDiff(); loadAiValuation(); }
            if (isCustom) updateCustomValuation();
        });

        // 手动输入商品时触发AI估值
        function updateCustomValuation() {
            var name = document.getElementById('customName').value.trim();
            var brand = document.getElementById('customBrand').value.trim();
            if (!name) return;
            var desc = name + (brand ? ' 品牌:' + brand : '') + ' 成色:' + (document.getElementById('customCondition').value || 'good');
            fetch('/api/ai/valuation/evaluate-from-desc', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ description: desc, condition: document.getElementById('customCondition').value || 'good' })
            }).then(r => r.json()).then(data => {
                if (data.success && data.data) {
                    document.getElementById('my-valuation').style.display = 'block';
                    document.getElementById('my-valuation').innerHTML = 'AI估值: <strong style="color:#667eea;">¥' + (data.data.estimatedValue || 0) + '</strong>';
                    if (!document.getElementById('customPrice').value) {
                        document.getElementById('customPrice').value = (data.data.estimatedValue || 0);
                    }
                }
            }).catch(function(){});
        }
        document.getElementById('customName').addEventListener('blur', updateCustomValuation);
        document.getElementById('customBrand').addEventListener('blur', updateCustomValuation);
        document.getElementById('customCondition').addEventListener('change', updateCustomValuation);

        // 获取目标商品AI估值
        fetch('/exchange/valuation/' + targetProductId)
            .then(r => r.json())
            .then(data => {
                if (data.success && data.data) {
                    aiValuations.target = data.data;
                    displayAiValuation('target-valuation', data.data);
                }
            }).catch(() => {});

        function loadAiValuation() {
            const myProductId = document.getElementById('myProductId').value;
            if (!myProductId) return;
            fetch('/exchange/valuation/' + myProductId)
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.data) {
                        aiValuations.mine = data.data;
                        displayAiValuation('my-valuation', data.data);
                        loadRecommendedDiff();
                    }
                }).catch(() => {});
        }

        function displayAiValuation(elementId, data) {
            const el = document.getElementById(elementId);
            if (!el || !data) return;
            el.style.display = 'block';
            el.innerHTML = 'AI估值: <strong style="color:#667eea;">¥' + (data.estimatedValue || 0) + '</strong> ' +
                '<span style="font-size:12px;color:#999;">(市场: ¥' + (data.marketRangeLow || 0) + ' - ¥' + (data.marketRangeHigh || 0) + ')</span>';
        }

        function loadRecommendedDiff() {
            const myProductId = document.getElementById('myProductId').value;
            if (!myProductId) return;
            fetch('/exchange/recommended-diff/' + myProductId + '/' + targetProductId)
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.data !== undefined) {
                        const diff = parseFloat(data.data);
                        const el = document.getElementById('recommended-diff');
                        el.style.display = 'block';
                        if (diff > 0) {
                            el.innerHTML = '🤖 AI推荐: 您应补差价 <strong style="color:#e74c3c;">¥' + diff.toFixed(2) + '</strong>';
                        } else if (diff < 0) {
                            el.innerHTML = '🤖 AI推荐: 对方应补您差价 <strong style="color:#27ae60;">¥' + Math.abs(diff).toFixed(2) + '</strong>';
                        } else {
                            el.innerHTML = '🤖 AI推荐: 等价交换，无需补差价';
                        }
                    }
                }).catch(() => {});
        }

        function calculatePriceDiff() {
            const myProductId = document.getElementById('myProductId').value;
            if (!myProductId) {
                document.getElementById('priceDiffBox').style.display = 'none';
                return;
            }
            const select = document.getElementById('myProductId');
            const selectedOption = select.options[select.selectedIndex];
            const text = selectedOption.text;
            const match = text.match(/¥([\d.]+)/);
            if (match) {
                const myPrice = parseFloat(match[1]);
                const diff = targetPrice - myPrice;
                document.getElementById('priceDiffBox').style.display = 'block';
                if (diff > 0) {
                    document.getElementById('priceDiffAmount').textContent = '¥' + diff.toFixed(2);
                    document.getElementById('priceDiffText').textContent = '您需要补给对方 ¥' + diff.toFixed(2);
                } else if (diff < 0) {
                    document.getElementById('priceDiffAmount').textContent = '¥' + Math.abs(diff).toFixed(2);
                    document.getElementById('priceDiffText').textContent = '对方需要补给您 ¥' + Math.abs(diff).toFixed(2);
                } else {
                    document.getElementById('priceDiffAmount').textContent = '¥0.00';
                    document.getElementById('priceDiffText').textContent = '等价交换，无需补差价';
                }
            }
        }

        async function submitExchange() {
            var myProductId = document.getElementById('myProductId').value;
            var receiverAddress = document.getElementById('receiverAddress').value;
            var initiatorAddress = document.getElementById('initiatorAddress').value;
            var remark = document.getElementById('remark').value;
            if (!myProductId) { alert('请选择或输入您的商品'); return; }
            if (!receiverAddress) { alert('请填写您的收货地址'); return; }
            if (!initiatorAddress) { alert('请填写对方的收货地址'); return; }

            // 手动输入商品：先创建商品
            if (myProductId === 'custom') {
                var customName = document.getElementById('customName').value.trim();
                var customPrice = parseFloat(document.getElementById('customPrice').value) || 0;
                var customBrand = document.getElementById('customBrand').value.trim();
                var customCondition = document.getElementById('customCondition').value;
                var customDesc = document.getElementById('customDesc').value.trim();
                if (!customName) { alert('请输入您的商品名称'); return; }
                try {
                    var createResp = await fetch('/merchant/product/add', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: customName,
                            price: customPrice,
                            brand: customBrand,
                            productCondition: customCondition,
                            description: customDesc || customName,
                            stock: 1,
                            status: 1
                        })
                    });
                    var createResult = await createResp.json();
                    if (!createResult.success) { alert('创建商品失败：' + createResult.message); return; }
                    // product ID is in createResult.data
                    myProductId = createResult.data ? createResult.data.id : null;
                    if (!myProductId) { alert('创建商品失败'); return; }
                } catch (e) {
                    alert('创建商品失败，请重试'); return;
                }
            } else {
                myProductId = parseInt(myProductId);
            }

            const orderData = {
                receiverId: receiverId,
                initiatorProductId: myProductId,
                receiverProductId: targetProductId,
                initiatorAddress: initiatorAddress,
                receiverAddress: receiverAddress,
                remark: remark
            };
            try {
                const response = await fetch('/exchange/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                const result = await response.json();
                if (result.success) {
                    alert(result.message);
                    window.location.href = '/exchange/my-orders';
                } else {
                    alert(result.message);
                }
            } catch (error) {
                alert('提交失败，请重试');
            }
        }
    </script>

    <div class="mobile-bottom-nav">
        <div class="nav-items">
            <a href="/" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>首页</span>
            </a>
            <a href="/product/list" class="nav-item">
                <span class="nav-icon">📦</span>
                <span>商品</span>
            </a>
            <a href="/cart/view" class="nav-item">
                <span class="nav-icon">🛒</span>
                <span>购物车</span>
            </a>
            <a href="/order/list" class="nav-item">
                <span class="nav-icon">📋</span>
                <span>订单</span>
            </a>
            <a href="/exchange/market" class="nav-item">
                <span class="nav-icon">🔄</span>
                <span>交换</span>
            </a>
        </div>
    </div>
</body>
</html>
