<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户列表 - 线上购物与交易系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar desktop-nav">
    <div class="nav-container">
        <a th:href="@{/}" class="nav-brand">线上购物与交易系统</a>
        <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <ul class="nav-menu">
            <li class="nav-item"><a th:href="@{/}">首页</a></li>
            <li class="nav-item active"><a th:href="@{/userlist}">用户管理</a></li>
            <li class="nav-item"><a th:href="@{/admin/dashboard}">控制台</a></li>
            <li class="nav-item"><a th:href="@{/logout}">退出</a></li>
        </ul>
    </div>
</div>

<div class="mobile-dropdown" id="mobileDropdown">
    <a href="/">首页</a>
    <a href="/userlist">用户管理</a>
    <a href="/admin/dashboard">控制台</a>
    <a href="/product/list">商品</a>
    <a href="/order/list">订单</a>
    <a href="/logout">退出</a>
</div>

<div class="container">
    <div class="page-header">
        <h1>用户管理</h1>
        <button class="add-btn" onclick="window.location.href='/adduser'">+ 添加用户</button>
    </div>

    <div class="user-count">
        共有 <strong th:text="${#lists.size(users)}">0</strong> 个用户
    </div>

    <div th:if="${#lists.isEmpty(users)}" class="no-users">
        <div class="no-users-icon">📭</div>
        <p>暂无用户数据</p>
        <p style="margin-top: 20px;">
            <button class="add-btn" onclick="window.location.href='/adduser'">+ 添加第一个用户</button>
        </p>
    </div>

    <table th:unless="${#lists.isEmpty(users)}" class="user-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>邮箱</th>
                <th>手机号</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.username}">admin</td>
                <td th:text="${user.email != null ? user.email : '-'}">-</td>
                <td th:text="${user.phone != null ? user.phone : '-'}">-</td>
                <td>
                    <a th:href="@{/edituser(id=${user.id})}" class="action-btn edit-btn">编辑</a>
                    <form th:action="@{/deleteUser}" method="post" style="display: inline;" onsubmit="return confirm('确定要删除该用户吗？此操作不可恢复！')">
                        <input type="hidden" name="id" th:value="${user.id}" />
                        <button type="submit" class="action-btn delete-btn" th:if="${user.username != 'admin'}">删除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    function toggleMobileMenu() {
        var menu = document.getElementById('mobileDropdown');
        if (menu) menu.classList.toggle('show');
    }
    document.addEventListener('DOMContentLoaded', function() {
        var menu = document.getElementById('mobileDropdown');
        if (!menu) return;
        document.addEventListener('click', function(e) {
            if (e.target.closest('.hamburger-btn')) return;
            if (!e.target.closest('.mobile-dropdown')) menu.classList.remove('show');
        });
    });
</script>

<div class="mobile-bottom-nav">
    <div class="nav-items">
        <a href="/" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>首页</span>
        </a>
        <a href="/userlist" class="nav-item active">
            <span class="nav-icon">👥</span>
            <span>用户</span>
        </a>
        <a href="/product/list" class="nav-item">
            <span class="nav-icon">📦</span>
            <span>商品</span>
        </a>
        <a href="/order/list" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>订单</span>
        </a>
        <a href="/admin/dashboard" class="nav-item">
            <span class="nav-icon">📊</span>
            <span>控制台</span>
        </a>
    </div>
</div>

<div class="footer">
    &copy; 2026 线上购物与交易系统. All rights reserved.
</div>
</body>
</html>
