<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统测试 - 线上购物与交易系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar desktop-nav">
    <div class="nav-container">
        <a th:href="@{/}" class="nav-brand">线上购物与交易系统</a>
        <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <ul class="nav-menu">
            <li class="nav-item"><a th:href="@{/}">首页</a></li>
            <li class="nav-item"><a th:href="@{/product/list}">商品</a></li>
            <li class="nav-item active"><a th:href="@{/test}">系统测试</a></li>
            <li class="nav-item"><a th:href="@{/logout}">退出</a></li>
        </ul>
    </div>
</div>

<div class="mobile-dropdown" id="mobileDropdown">
    <a href="/">首页</a>
    <a href="/product/list">商品</a>
    <a href="/order/list">订单</a>
    <a href="/admin/dashboard">控制台</a>
    <a href="/test">系统测试</a>
    <a href="/logout">退出</a>
</div>

<div class="container">
    <h1>系统测试中心</h1>

    <div class="test-summary">
        <h3>测试报告</h3>
        <div class="summary-stats">
            <div class="stat-item">
                <div class="stat-number" th:text="${successCount}">0</div>
                <div class="stat-label">通过</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" th:text="${errorCount}">0</div>
                <div class="stat-label">失败</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" th:text="${warningCount}">0</div>
                <div class="stat-label">警告</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" th:text="${totalCount}">0</div>
                <div class="stat-label">总计</div>
            </div>
        </div>
    </div>

    <div class="test-section">
        <h2>基础环境测试</h2>
        <div th:each="test : ${envTests}" th:class="${'test-item ' + test.status}">
            <div>
                <div class="test-name" th:text="${test.name}">测试项</div>
                <div class="test-detail" th:text="${test.detail}">详细信息</div>
            </div>
            <span th:class="${'test-status status-' + test.status}" th:text="${test.statusText}">状态</span>
        </div>
    </div>

    <div class="test-section">
        <h2>数据库测试</h2>
        <div th:each="test : ${dbTests}" th:class="${'test-item ' + test.status}">
            <div>
                <div class="test-name" th:text="${test.name}">测试项</div>
                <div class="test-detail" th:text="${test.detail}">详细信息</div>
            </div>
            <span th:class="${'test-status status-' + test.status}" th:text="${test.statusText}">状态</span>
        </div>
    </div>

    <div class="test-section">
        <h2>JWT 功能测试</h2>
        <div th:each="test : ${jwtTests}" th:class="${'test-item ' + test.status}">
            <div>
                <div class="test-name" th:text="${test.name}">测试项</div>
                <div class="test-detail" th:text="${test.detail}">详细信息</div>
            </div>
            <span th:class="${'test-status status-' + test.status}" th:text="${test.statusText}">状态</span>
        </div>
    </div>

    <div class="test-section">
        <h2>用户功能测试</h2>
        <div th:each="test : ${userTests}" th:class="${'test-item ' + test.status}">
            <div>
                <div class="test-name" th:text="${test.name}">测试项</div>
                <div class="test-detail" th:text="${test.detail}">详细信息</div>
            </div>
            <span th:class="${'test-status status-' + test.status}" th:text="${test.statusText}">状态</span>
        </div>
    </div>

    <div style="text-align: center; margin-top: 30px;">
        <a th:href="@{/test(runAll=true)}" class="btn-test">重新运行所有测试</a>
        <a th:href="@{/}" class="btn-test" style="background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);">返回首页</a>
    </div>
</div>

<script>
    function toggleMobileMenu() {
        var menu = document.getElementById('mobileDropdown');
        if (menu) menu.classList.toggle('show');
    }
    document.addEventListener('DOMContentLoaded', function() {
        var menu = document.getElementById('mobileDropdown');
        if (!menu) return;
        document.addEventListener('click', function(e) {
            if (e.target.closest('.hamburger-btn')) return;
            if (!e.target.closest('.mobile-dropdown')) menu.classList.remove('show');
        });
    });
</script>

<div class="mobile-bottom-nav">
    <div class="nav-items">
        <a href="/" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>首页</span>
        </a>
        <a href="/product/list" class="nav-item">
            <span class="nav-icon">📦</span>
            <span>商品</span>
        </a>
        <a href="/order/list" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>订单</span>
        </a>
        <a href="/admin/dashboard" class="nav-item">
            <span class="nav-icon">📊</span>
            <span>控制台</span>
        </a>
        <a href="/test" class="nav-item active">
            <span class="nav-icon">🔍</span>
            <span>测试</span>
        </a>
    </div>
</div>

<div class="footer">
    &copy; 2026 线上购物与交易系统. All rights reserved.
</div>
</body>
</html>
