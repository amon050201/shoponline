<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/admin-layout :: layout"
      th:with="pageTitle='操作日志', activePage='logs', content=~{::page-content}, extraHead=~{::admin-head}">
<head>
    <link th:fragment="admin-head" rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:fragment="page-content">

    <div class="page-header">
        <h1>操作日志</h1>
        <p>记录所有管理员在后台的操作行为，便于审计和追溯。</p>
    </div>

    <!-- Filter Toolbar -->
    <div class="admin-card" style="margin-bottom:16px;">
        <div class="admin-card-body" style="padding:16px 20px;">
            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="search-box">
                        <input type="text" id="searchKeyword" placeholder="搜索用户 / 操作 / 模块..." onkeyup="if(event.key==='Enter')searchLogs()">
                        <button type="button" class="btn btn-primary" onclick="searchLogs()">搜索</button>
                    </div>
                    <select id="filterModule" onchange="searchLogs()" style="padding:8px 12px;border:1px solid var(--admin-border);border-radius:var(--admin-radius);font-size:13px;">
                        <option value="">全部模块</option>
                        <option value="用户管理">用户管理</option>
                        <option value="仪表盘">仪表盘</option>
                        <option value="系统日志">系统日志</option>
                        <option value="系统管理">系统管理</option>
                    </select>
                    <input type="date" id="filterDateStart" title="开始日期" style="padding:6px 10px;border:1px solid var(--admin-border);border-radius:var(--admin-radius);font-size:13px;" onchange="searchLogs()">
                    <span style="color:var(--admin-text-muted);font-size:13px;">至</span>
                    <input type="date" id="filterDateEnd" title="结束日期" style="padding:6px 10px;border:1px solid var(--admin-border);border-radius:var(--admin-radius);font-size:13px;" onchange="searchLogs()">
                </div>
                <div class="toolbar-right">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="cleanOldLogs()">清理90天前日志</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Log Table -->
    <div class="admin-card">
        <div class="admin-card-body no-padding">
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>操作用户</th>
                            <th>模块</th>
                            <th>操作</th>
                            <th>方法</th>
                            <th>IP</th>
                            <th>结果</th>
                            <th>耗时</th>
                            <th>时间</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody">
                        <tr><td colspan="9"><div class="loading-text">加载中...</div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="pagination-bar" id="paginationBar"></div>

<!-- Log Detail Modal -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-card" style="max-width:600px;">
        <div class="modal-header">
            <h3>日志详情</h3>
            <button type="button" class="modal-close" onclick="closeModal('detailModal')">&times;</button>
        </div>
        <div class="modal-body">
            <div class="log-detail-grid" id="logDetailContent"></div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModal('detailModal')">关闭</button>
        </div>
    </div>
</div>

<script th:replace="fragments/admin-layout :: sidebar-script"></script>
<script>
var currentPage = 1;
var pageSize = 15;

function showToast(msg, type) {
    type = type || 'info';
    var t = document.createElement('div');
    t.className = 'admin-toast ' + type;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.classList.add('hide'); t.addEventListener('animationend', function(){ t.remove(); }); }, 2500);
}

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function loadLogs() {
    var kw = document.getElementById('searchKeyword').value.trim();
    var mod = document.getElementById('filterModule').value;
    var ds = document.getElementById('filterDateStart').value;
    var de = document.getElementById('filterDateEnd').value;
    var params = '?page=' + currentPage + '&pageSize=' + pageSize;
    if (kw) params += '&keyword=' + encodeURIComponent(kw);
    if (mod) params += '&module=' + encodeURIComponent(mod);
    if (ds && de) { params += '&dateStart=' + ds + '&dateEnd=' + de; }

    fetch('/admin/api/logs' + params)
        .then(function(r){ return r.json(); })
        .then(function(d){
            if (!d.success) { showToast(d.message||'加载失败', 'error'); return; }
            renderTable(d.data.logs);
            renderPagination(d.data.total, d.data.page, d.data.pageSize);
        })
        .catch(function(){ showToast('网络错误', 'error'); });
}

function renderTable(logs) {
    var tbody = document.getElementById('logTableBody');
    if (!logs || logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#9645;</div><p>暂无操作日志</p></div></td></tr>';
        return;
    }
    var html = '';
    logs.forEach(function(l){
        var isError = l.result && l.result.indexOf('异常') >= 0;
        var resultShort = l.result || '成功';
        if (resultShort.length > 30) resultShort = resultShort.substring(0,30)+'...';
        var params = l.params || '';
        if (params.length > 50) params = params.substring(0,50)+'...';
        html += '<tr class="log-row" onclick="showDetail(event)" style="cursor:pointer;">';
        html += '<td>'+l.id+'</td>';
        html += '<td><strong>'+escapeHtml(l.username)+'</strong><span class="text-xs text-muted"> (ID:'+(l.userId||0)+')</span></td>';
        html += '<td><span class="badge badge-blue">'+escapeHtml(l.module||'')+'</span></td>';
        html += '<td>'+escapeHtml(l.operation||'')+'</td>';
        html += '<td class="text-sm text-muted max-w-200 text-ellipsis" title="'+escapeHtml(l.method||'')+'">'+escapeHtml(l.method||'')+'</td>';
        html += '<td class="text-sm text-muted">'+escapeHtml(l.ip||'-')+'</td>';
        html += '<td><span class="badge '+(isError?'badge-red':'badge-green')+'">'+escapeHtml(resultShort)+'</span></td>';
        html += '<td class="text-sm text-muted">'+(l.duration||0)+'ms</td>';
        html += '<td class="text-sm text-muted text-nowrap">'+(l.createdTime ? l.createdTime.substring(0,19) : '-')+'</td>';
        html += '</tr>';
    });
    tbody.innerHTML = html;
}

function renderPagination(total, page, ps) {
    var totalPages = Math.ceil(total / ps);
    var bar = document.getElementById('paginationBar');
    if (totalPages <= 1) { bar.innerHTML = '<span class="pagination-info">共 '+total+' 条</span>'; return; }
    var html = '<span class="pagination-info">共 '+total+' 条，第 '+page+'/'+totalPages+' 页</span>';
    html += '<div class="pagination-btns">';
    html += '<button type="button" class="btn btn-sm btn-secondary" onclick="goPage('+(page-1)+')" '+(page<=1?'disabled':'')+'>上一页</button>';
    for (var i=1; i<=totalPages; i++) {
        if (totalPages<=7 || i===1 || i===totalPages || (i>=page-1 && i<=page+1)) {
            html += '<button type="button" class="btn btn-sm '+(i===page?'btn-primary':'btn-secondary')+'" onclick="goPage('+i+')">'+i+'</button>';
        } else if (i===page-2 || i===page+2) {
            html += '<span class="pagination-ellipsis">...</span>';
        }
    }
    html += '<button type="button" class="btn btn-sm btn-secondary" onclick="goPage('+(page+1)+')" '+(page>=totalPages?'disabled':'')+'>下一页</button>';
    html += '</div>';
    bar.innerHTML = html;
}

function goPage(p) { currentPage = p; loadLogs(); }
function searchLogs() { currentPage = 1; loadLogs(); }

function showDetail(evt) {
    var row = evt.currentTarget;
    var cells = row.querySelectorAll('td');
    if (cells.length < 9) return;
    var detail = {
        id: cells[0].textContent,
        username: (cells[1].querySelector('strong')||{}).textContent||'',
        module: (cells[2].querySelector('.badge')||{}).textContent||cells[2].textContent,
        operation: cells[3].textContent,
        method: cells[4].getAttribute('title')||cells[4].textContent,
        ip: cells[5].textContent,
        result: (cells[6].querySelector('.badge')||{}).textContent||cells[6].textContent,
        duration: cells[7].textContent,
        time: cells[8].textContent
    };
    var html = '';
    var fields = [
        ['ID', detail.id], ['操作用户', detail.username], ['模块', detail.module],
        ['操作', detail.operation], ['方法', detail.method], ['IP地址', detail.ip],
        ['结果', detail.result], ['耗时', detail.duration], ['时间', detail.time]
    ];
    fields.forEach(function(f){
        html += '<div class="log-detail-item"><span class="log-detail-label">'+f[0]+'</span><span class="log-detail-value">'+escapeHtml(f[1]||'-')+'</span></div>';
    });
    document.getElementById('logDetailContent').innerHTML = html;
    openModal('detailModal');
}

function cleanOldLogs() {
    if (!confirm('确定要清理90天前的操作日志吗？此操作不可恢复。')) return;
    fetch('/admin/api/logs/clean?days=90', { method:'DELETE' })
        .then(function(r){return r.json()}).then(function(d){
            showToast(d.message, d.success?'success':'error');
            if (d.success) loadLogs();
        });
}

function escapeHtml(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.addEventListener('click', function(e) {
    if (e.target.classList.contains('modal-overlay')) e.target.style.display = 'none';
});

loadLogs();
</script>
</div>
</body>
</html>
