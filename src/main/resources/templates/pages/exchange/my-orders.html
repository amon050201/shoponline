<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的交换订单 - 线上购物与交易系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>我的交换订单</h1>
            <a href="/exchange/market" class="btn-back">返回市场</a>
        </div>

        <div class="section">
            <div class="section-title">我发起的交换</div>
            <div th:if="${#lists.isEmpty(initiatedOrders)}" class="empty-state">
                <div class="empty-state-icon">📭</div>
                <p>暂无发起的交换订单</p>
            </div>
            <div th:each="order : ${initiatedOrders}" class="order-card">
                <div class="order-header">
                    <div class="order-no" th:text="'订单号: ' + ${order.orderNo}">订单号</div>
                    <div class="order-status" th:classappend="${'status-' + order.getStatusText()}" th:text="${order.statusText}">状态</div>
                </div>
                <div class="order-body">
                    <div class="product-info">
                        <div class="product-label">您的商品</div>
                        <div class="product-name" th:text="${order.initiatorProduct != null ? order.initiatorProduct.name : '商品已下架'}">商品名称</div>
                        <div class="product-price" th:text="${order.initiatorProduct != null ? '¥' + order.initiatorProduct.price : ''}">价格</div>
                    </div>
                    <div class="exchange-arrow">⇄</div>
                    <div class="product-info">
                        <div class="product-label">对方商品</div>
                        <div class="product-name" th:text="${order.receiverProduct != null ? order.receiverProduct.name : '商品已下架'}">商品名称</div>
                        <div class="product-price" th:text="${order.receiverProduct != null ? '¥' + order.receiverProduct.price : ''}">价格</div>
                    </div>
                </div>
                <div class="price-diff" th:if="${order.priceDifference != 0}">
                    <div class="price-diff-label">差价</div>
                    <div class="price-diff-amount" th:text="${order.priceDifference > 0 ? '您需要补: ¥' + order.priceDifference : '对方需补: ¥' + (-order.priceDifference)}">差价金额</div>
                </div>
                <div class="order-footer">
                    <div class="order-time" th:text="'创建时间: ' + ${#temporals.format(order.createdTime, 'yyyy-MM-dd HH:mm:ss')}">创建时间</div>
                    <div class="order-actions">
                        <button th:if="${order.status == 0}" class="btn btn-cancel" th:onclick="'cancelOrder(' + ${order.id} + ')'">取消订单</button>
                        <button th:if="${order.status == 1 && order.paymentStatus == 0 && order.priceDifference > 0}" class="btn btn-pay" th:onclick="'payDifference(' + ${order.id} + ')'">支付差价</button>
                        <button th:if="${order.status == 1 && order.paymentStatus == 1}" class="btn btn-complete" th:onclick="'completeOrder(' + ${order.id} + ')'">确认完成</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">我收到的交换请求</div>
            <div th:if="${#lists.isEmpty(receivedOrders)}" class="empty-state">
                <div class="empty-state-icon">📭</div>
                <p>暂无收到的交换请求</p>
            </div>
            <div th:each="order : ${receivedOrders}" class="order-card">
                <div class="order-header">
                    <div class="order-no" th:text="'订单号: ' + ${order.orderNo}">订单号</div>
                    <div class="order-status" th:classappend="${'status-' + order.getStatusText()}" th:text="${order.statusText}">状态</div>
                </div>
                <div class="order-body">
                    <div class="product-info">
                        <div class="product-label">对方商品</div>
                        <div class="product-name" th:text="${order.initiatorProduct != null ? order.initiatorProduct.name : '商品已下架'}">商品名称</div>
                        <div class="product-price" th:text="${order.initiatorProduct != null ? '¥' + order.initiatorProduct.price : ''}">价格</div>
                    </div>
                    <div class="exchange-arrow">⇄</div>
                    <div class="product-info">
                        <div class="product-label">您的商品</div>
                        <div class="product-name" th:text="${order.receiverProduct != null ? order.receiverProduct.name : '商品已下架'}">商品名称</div>
                        <div class="product-price" th:text="${order.receiverProduct != null ? '¥' + order.receiverProduct.price : ''}">价格</div>
                    </div>
                </div>
                <div class="price-diff" th:if="${order.priceDifference != 0}">
                    <div class="price-diff-label">差价</div>
                    <div class="price-diff-amount" th:text="${order.priceDifference > 0 ? '对方需补: ¥' + order.priceDifference : '您需补: ¥' + (-order.priceDifference)}">差价金额</div>
                </div>
                <div class="order-footer">
                    <div class="order-time" th:text="'请求时间: ' + ${#temporals.format(order.createdTime, 'yyyy-MM-dd HH:mm:ss')}">请求时间</div>
                    <div class="order-actions">
                        <button th:if="${order.status == 0}" class="btn btn-confirm" th:onclick="'confirmOrder(' + ${order.id} + ')'">确认交换</button>
                        <button th:if="${order.status == 0}" class="btn btn-reject" th:onclick="'rejectOrder(' + ${order.id} + ')'">拒绝请求</button>
                        <button th:if="${order.status == 1 && order.paymentStatus == 0 && order.priceDifference < 0}" class="btn btn-pay" th:onclick="'payDifference(' + ${order.id} + ')'">支付差价</button>
                        <button th:if="${order.status == 1 && order.paymentStatus == 1}" class="btn btn-complete" th:onclick="'completeOrder(' + ${order.id} + ')'">确认完成</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function confirmOrder(orderId) {
            if (!confirm('确认接受这个交换请求吗？')) return;
            try { const r = await fetch('/exchange/confirm/' + orderId, { method:'POST' }); const d = await r.json(); alert(d.message); if (d.success) location.reload(); } catch(e) { alert('操作失败'); }
        }
        async function rejectOrder(orderId) {
            if (!confirm('确认拒绝这个交换请求吗？')) return;
            try { const r = await fetch('/exchange/reject/' + orderId, { method:'POST' }); const d = await r.json(); alert(d.message); if (d.success) location.reload(); } catch(e) { alert('操作失败'); }
        }
        async function cancelOrder(orderId) {
            if (!confirm('确认取消这个交换订单吗？')) return;
            try { const r = await fetch('/exchange/cancel/' + orderId, { method:'POST' }); const d = await r.json(); alert(d.message); if (d.success) location.reload(); } catch(e) { alert('操作失败'); }
        }
        async function completeOrder(orderId) {
            if (!confirm('确认交易已完成吗？完成后将无法撤销。')) return;
            try { const r = await fetch('/exchange/complete/' + orderId, { method:'POST' }); const d = await r.json(); alert(d.message); if (d.success) location.reload(); } catch(e) { alert('操作失败'); }
        }
        async function payDifference(orderId) {
            const pm = prompt('请选择支付方式（wechat/alipay）:', 'wechat');
            if (!pm) return;
            try { const r = await fetch('/exchange/pay/' + orderId + '?paymentMethod=' + pm, { method:'POST' }); const d = await r.json(); alert(d.message); if (d.success) location.reload(); } catch(e) { alert('支付失败'); }
        }
    </script>

    <div class="mobile-bottom-nav">
        <div class="nav-items">
            <a href="/" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>首页</span>
            </a>
            <a href="/product/list" class="nav-item">
                <span class="nav-icon">📦</span>
                <span>商品</span>
            </a>
            <a href="/cart/view" class="nav-item">
                <span class="nav-icon">🛒</span>
                <span>购物车</span>
            </a>
            <a href="/order/list" class="nav-item">
                <span class="nav-icon">📋</span>
                <span>订单</span>
            </a>
            <a href="/exchange/market" class="nav-item">
                <span class="nav-icon">🔄</span>
                <span>交换</span>
            </a>
        </div>
    </div>
</body>
</html>
