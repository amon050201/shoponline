<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- Background Glow Effect -->
<div class="glow-effect"></div>

<!-- Floating Background Shapes -->
<div class="floating-shapes">
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
</div>

<!-- 移动端顶部栏 -->
<div class="mobile-top-bar">
    <a href="/" class="back-btn">←</a>
    <span class="page-title">用户注册</span>
    <a href="/login" class="right-action">登录</a>
</div>

<div class="form-container">
    <h2>✨ 用户注册</h2>

    <!-- Session message display -->
    <div th:if="${session.message}" th:class="${'message ' + session.messageType}" th:text="${session.message}"></div>

    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label for="username">👤 用户名</label>
            <input type="text" id="username" name="username" placeholder="3-20个字符" required>
        </div>
        <div class="form-group">
            <label for="password">🔑 密码</label>
            <input type="password" id="password" name="password" placeholder="至少6个字符" required>
        </div>
        <div class="form-group">
            <label for="confirmPassword">🔒 确认密码</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="再次输入密码" required>
        </div>
        <div class="form-group">
            <label for="captcha">🛡️ 验证码</label>
            <div class="captcha-group">
                <input type="text" id="captcha" name="captcha" class="captcha-input" placeholder="请输入验证码" required maxlength="4">
                <img src="/captcha" alt="验证码" class="captcha-image" id="captchaImage" title="点击刷新验证码">
            </div>
        </div>
        <div class="form-group">
            <label>👤 注册角色</label>
            <div class="radio-group">
                <label><input type="radio" name="roleType" value="0" checked required> 👨‍💼 顾客</label>
                <label><input type="radio" name="roleType" value="1"> 🏪 商家</label>
            </div>
            <small style="color: #666; font-size: 12px;">* 顾客可以购物，商家可以发布商品</small>
        </div>
        <div class="form-group">
            <label>⚧ 性别</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="male" required> 男</label>
                <label><input type="radio" name="gender" value="female"> 女</label>
            </div>
        </div>
        <div class="form-group">
            <label>❤️ 爱好</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="hobbies" value="reading"> 阅读</label>
                <label><input type="checkbox" name="hobbies" value="sports"> 运动</label>
                <label><input type="checkbox" name="hobbies" value="music"> 音乐</label>
            </div>
        </div>
        <div class="button-group">
            <button type="submit" class="btn-primary">注册</button>
            <button type="reset" class="btn-secondary">重置</button>
        </div>
    </form>
</div>

<div class="footer">
    &copy; 2026 线上购物与交易系统. All rights reserved. |
    <a href="#">隐私政策</a> |
    <a href="#">服务条款</a>
</div>

<!-- 移动端底部导航 -->
<div class="mobile-bottom-nav">
    <div class="nav-items">
        <a href="/" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>首页</span>
        </a>
        <a href="/product/list" class="nav-item">
            <span class="nav-icon">📦</span>
            <span>商品</span>
        </a>
        <a href="/login" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>登录</span>
        </a>
    </div>
</div>

<script>
    document.getElementById('captchaImage').addEventListener('click', function() {
        this.src = '/captcha?' + new Date().getTime();
    });
    document.getElementById('username').focus();

    // 移动端下拉菜单
    document.addEventListener('DOMContentLoaded', function() {
        var hamburger = document.querySelector('.hamburger-btn');
        var dropdown = document.querySelector('.mobile-dropdown');
        if (hamburger && dropdown) {
            hamburger.addEventListener('click', function() {
                dropdown.classList.toggle('show');
            });
            document.addEventListener('click', function(e) {
                if (!hamburger.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove('show');
                }
            });
        }
    });
</script>

</body>
</html>
