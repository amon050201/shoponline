<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收货地址 - 线上购物与交易系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar desktop-nav">
    <div class="nav-container">
        <a href="/" class="nav-brand">线上购物与交易系统</a>
        <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <ul class="nav-menu">
            <li class="nav-item"><a href="/product/list">商品列表</a></li>
            <li class="nav-item"><a href="/cart/view">购物车</a></li>
            <li class="nav-item"><a href="/order/list">我的订单</a></li>
            <li class="nav-item"><a href="/address/list">收货地址</a></li>
            <li class="nav-item"><a href="/logout">退出</a></li>
        </ul>
    </div>
</div>

<div class="mobile-dropdown" id="mobileDropdown">
    <a href="/">首页</a>
    <a href="/product/list">商品列表</a>
    <a href="/cart/view">购物车</a>
    <a href="/order/list">我的订单</a>
    <a href="/address/list">收货地址</a>
    <a href="/exchange/market">以物易物</a>
    <a href="/logout">退出登录</a>
</div>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="color: #2c3e50;">收货地址</h2>
        <a href="/address/edit" class="btn btn-primary" style="padding: 10px 24px; text-decoration: none;">+ 新增地址</a>
    </div>

    <div th:if="${addresses != null and !addresses.isEmpty()}">
        <div th:each="addr : ${addresses}" class="address-card-web"
             style="background: white; border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: flex-start;">
            <div style="flex:1;">
                <div style="display: flex; align-items: center; margin-bottom: 10px; flex-wrap: wrap;">
                    <span style="font-size: 18px; font-weight: bold; margin-right: 12px;" th:text="${addr.receiverName}">张三</span>
                    <span style="color: #666;" th:text="${addr.receiverPhone}">138****</span>
                    <span th:if="${addr.isDefault == 1}"
                          style="background: #ff4757; color: white; font-size: 12px; padding: 2px 10px; border-radius: 10px; margin-left: 12px;">默认</span>
                    <span th:if="${addr.label != null and addr.label != ''}"
                          style="background: #f0f4ff; color: #667eea; font-size: 12px; padding: 2px 10px; border-radius: 10px; margin-left: 8px;" th:text="${addr.label}">家</span>
                </div>
                <div style="color: #666; font-size: 14px; line-height: 1.5;" th:text="${addr.region + ' ' + addr.detailAddress}">地址</div>
            </div>
            <div style="display: flex; gap: 8px; flex-shrink: 0; margin-left: 16px;">
                <button th:if="${addr.isDefault != 1}" class="btn btn-secondary" style="font-size: 13px; padding: 6px 14px;" th:onclick="'setDefault(' + ${addr.id} + ')'">设为默认</button>
                <a th:href="@{/address/edit(id=${addr.id})}" class="btn btn-secondary" style="font-size: 13px; padding: 6px 14px; text-decoration: none;">编辑</a>
                <button class="btn btn-danger" style="font-size: 13px; padding: 6px 14px;" th:onclick="'deleteAddr(' + ${addr.id} + ')'">删除</button>
            </div>
        </div>
    </div>

    <div th:if="${addresses == null or addresses.isEmpty()}" style="text-align: center; padding: 60px 20px; background: white; border-radius: 12px;">
        <div style="font-size: 48px; margin-bottom: 16px;">📍</div>
        <h3 style="color: #666; margin-bottom: 8px;">还没有收货地址</h3>
        <p style="color: #999; margin-bottom: 20px;">添加地址后可以快速填写收货信息</p>
        <a href="/address/edit" class="btn btn-primary" style="padding: 12px 30px; text-decoration: none; display: inline-block;">+ 新增地址</a>
    </div>
</div>

<script>
    function deleteAddr(id) {
        if (!confirm('确定删除该地址？')) return;
        fetch('/address/delete/' + id, { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            alert(data.message);
            if (data.success) location.reload();
        });
    }

    function setDefault(id) {
        fetch('/address/set-default/' + id, { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            alert(data.message);
            if (data.success) location.reload();
        });
    }

    function toggleMobileMenu() {
        var menu = document.getElementById('mobileDropdown');
        if (menu) menu.classList.toggle('show');
    }
    document.addEventListener('DOMContentLoaded', function() {
        var menu = document.getElementById('mobileDropdown');
        if (!menu) return;
        document.addEventListener('click', function(e) {
            if (e.target.closest('.hamburger-btn')) return;
            if (!e.target.closest('.mobile-dropdown')) menu.classList.remove('show');
        });
    });
</script>

<div class="mobile-bottom-nav">
    <div class="nav-items">
        <a href="/" class="nav-item"><span class="nav-icon">🏠</span><span>首页</span></a>
        <a href="/product/list" class="nav-item"><span class="nav-icon">📦</span><span>商品</span></a>
        <a href="/cart/view" class="nav-item"><span class="nav-icon">🛒</span><span>购物车</span></a>
        <a href="/order/list" class="nav-item"><span class="nav-icon">📋</span><span>订单</span></a>
        <a href="/" class="nav-item"><span class="nav-icon">👤</span><span>我的</span></a>
    </div>
</div>
</body>
</html>
