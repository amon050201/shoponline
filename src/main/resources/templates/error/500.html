<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务器错误 - 线上购物系统</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.error-page { text-align:center; padding:80px 30px; max-width:500px; margin:10vh auto; background:rgba(255,255,255,0.95); border-radius:20px; box-shadow:0 8px 32px rgba(0,0,0,0.1); }
.error-icon { font-size:120px; margin-bottom:20px; }
.error-code { font-size:72px; font-weight:800; background:var(--gradient-main); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin:0; }
</style>
</head>
<body>
<div class="error-page">
  <div class="error-icon">🔧</div>
  <h1 class="error-code">500</h1>
  <p style="font-size:20px;color:#666;margin:16px 0;">服务器错误</p>
  <p style="color:#999;margin-bottom:32px;">抱歉，服务器遇到了问题，请稍后再试</p>
  <a href="/" class="btn btn-primary btn-lg" style="display:inline-flex;align-items:center;gap:8px;padding:14px 36px;font-size:16px;background:var(--gradient-main);color:#fff;border:none;border-radius:50px;text-decoration:none;box-shadow:0 6px 20px rgba(102,126,234,0.3);">← 返回首页</a>
  <p style="margin-top:32px;font-size:13px;color:#ccc;">线上购物与交易系统</p>
</div>
</body>
</html>
