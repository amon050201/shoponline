<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作日志 - 管理后台</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="admin-layout">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="admin-sidebar" id="adminSidebar">
        <a href="/admin/dashboard" class="sidebar-brand"><span class="brand-dot"></span>管理后台</a>
        <div class="sidebar-user">
            <div class="avatar" th:text="${username != null ? #strings.substring(username, 0, 1) : 'A'}">A</div>
            <div class="user-info"><div class="user-name" th:text="${username}">管理员</div><div class="user-role">系统管理员</div></div>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-section">主导航</div>
            <a href="/admin/dashboard"><span class="nav-icon">&#9632;</span>控制台</a>
            <a href="/admin/users"><span class="nav-icon">&#9633;</span>用户管理</a>
            <a href="/admin/logs" class="active"><span class="nav-icon">&#9645;</span>操作日志</a>
            <div class="sidebar-section" style="margin-top:12px;">快捷入口</div>
            <a href="/admin/products"><span class="nav-icon">&#9651;</span>商品管理</a>
            <a href="/order/list"><span class="nav-icon">&#9644;</span>订单管理</a>
            <a href="/test"><span class="nav-icon">&#9673;</span>系统测试</a>
        </nav>
        <div class="sidebar-footer"><a href="/">&#8592; 返回前台</a></div>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="菜单">&#9776;</button>
                <div class="breadcrumb"><span class="current">操作日志</span></div>
            </div>
            <div class="topbar-right">
                <span style="font-size:13px;color:var(--admin-text-muted);" th:text="'欢迎，' + ${username}">欢迎，管理员</span>
                <a href="/logout" class="topbar-btn danger"><span>&#10149;</span> <span>退出登录</span></a>
            </div>
        </header>
        <main class="admin-content">

    <div class="page-header"><h1>操作日志</h1><p>记录所有管理员在后台的操作行为，便于审计和追溯。</p></div>

    <div class="admin-card" style="margin-bottom:16px;"><div class="admin-card-body" style="padding:16px 20px;">
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="search-box">
                    <input type="text" id="searchKeyword" placeholder="搜索用户 / 操作 / 模块..." onkeyup="if(event.key==='Enter')searchLogs()">
                    <button type="button" class="btn btn-primary" onclick="searchLogs()">搜索</button>
                </div>
                <select id="filterModule" onchange="searchLogs()" style="padding:8px 12px;border:1px solid var(--admin-border);border-radius:var(--admin-radius);font-size:13px;">
                    <option value="">全部模块</option><option value="用户管理">用户管理</option><option value="仪表盘">仪表盘</option><option value="系统日志">系统日志</option><option value="系统管理">系统管理</option>
                </select>
                <input type="date" id="filterDateStart" title="开始日期" style="padding:6px 10px;border:1px solid var(--admin-border);border-radius:var(--admin-radius);font-size:13px;" onchange="searchLogs()">
                <span style="color:var(--admin-text-muted);font-size:13px;">至</span>
                <input type="date" id="filterDateEnd" title="结束日期" style="padding:6px 10px;border:1px solid var(--admin-border);border-radius:var(--admin-radius);font-size:13px;" onchange="searchLogs()">
            </div>
            <div class="toolbar-right">
                <button type="button" class="btn btn-secondary btn-sm" onclick="cleanOldLogs()">清理90天前日志</button>
            </div>
        </div>
    </div></div>

    <div class="admin-card"><div class="admin-card-body no-padding"><div class="admin-table-wrap">
        <table class="admin-table">
            <thead><tr><th>ID</th><th>操作用户</th><th>模块</th><th>操作</th><th>方法</th><th>IP</th><th>结果</th><th>耗时</th><th>时间</th></tr></thead>
            <tbody id="logTableBody"><tr><td colspan="9"><div class="loading-text">加载中...</div></td></tr></tbody>
        </table>
    </div></div></div>

    <div class="pagination-bar" id="paginationBar"></div>

        </main>
    </div>
</div>

<div class="modal-overlay" id="detailModal">
    <div class="modal-card" style="max-width:600px;">
        <div class="modal-header"><h3>日志详情</h3><button type="button" class="modal-close" onclick="closeModal('detailModal')">&times;</button></div>
        <div class="modal-body"><div class="log-detail-grid" id="logDetailContent"></div></div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeModal('detailModal')">关闭</button></div>
    </div>
</div>

<script>
function toggleSidebar() {
    var s = document.getElementById('adminSidebar');
    var o = document.getElementById('sidebarOverlay');
    if (s && o) { s.classList.toggle('open'); o.classList.toggle('show'); }
}
function closeSidebar() {
    var s = document.getElementById('adminSidebar');
    var o = document.getElementById('sidebarOverlay');
    if (s && o) { s.classList.remove('open'); o.classList.remove('show'); }
}
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.sidebar-nav a').forEach(function(link) {
        link.addEventListener('click', function() {
            if (window.innerWidth <= 768) closeSidebar();
        });
    });
});

var currentPage = 1;
var pageSize = 15;

function showToast(msg, type) {
    type = type || 'info';
    var t = document.createElement('div');
    t.className = 'admin-toast ' + type;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() {
        t.classList.add('hide');
        t.addEventListener('animationend', function() { t.remove(); });
    }, 2500);
}

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function loadLogs() {
    try {
        var kw = document.getElementById('searchKeyword').value.trim();
        var mod = document.getElementById('filterModule').value;
        var ds = document.getElementById('filterDateStart').value;
        var de = document.getElementById('filterDateEnd').value;
        var params = '?page=' + currentPage + '&pageSize=' + pageSize;
        if (kw) params += '&keyword=' + encodeURIComponent(kw);
        if (mod) params += '&module=' + encodeURIComponent(mod);
        if (ds && de) { params += '&dateStart=' + ds + '&dateEnd=' + de; }

        fetch('/admin/api/logs' + params)
            .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function(d) {
                if (!d.success) { showToast(d.message || '加载失败', 'error'); return; }
                renderTable(d.data.logs);
                renderPagination(d.data.total, d.data.page, d.data.pageSize);
            })
            .catch(function(e) {
                showToast('加载失败: ' + e.message, 'error');
            });
    } catch (e) {
        showToast('脚本错误: ' + e.message, 'error');
    }
}

function renderTable(logs) {
    var tbody = document.getElementById('logTableBody');
    if (!logs || logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#9645;</div><p>暂无操作日志</p></div></td></tr>';
        return;
    }
    var html = '';
    logs.forEach(function(l) {
        var isErr = l.result && l.result.indexOf('异常') >= 0;
        var rs = l.result || '成功';
        if (rs.length > 30) rs = rs.substring(0, 30) + '...';
        html += '<tr class="log-row" onclick="showDetail(event)" style="cursor:pointer;">';
        html += '<td>' + l.id + '</td>';
        html += '<td><strong>' + escapeHtml(l.username) + '</strong><span class="text-xs text-muted"> (ID:' + (l.userId || 0) + ')</span></td>';
        html += '<td><span class="badge badge-blue">' + escapeHtml(l.module || '') + '</span></td>';
        html += '<td>' + escapeHtml(l.operation || '') + '</td>';
        html += '<td class="text-sm text-muted max-w-200 text-ellipsis" title="' + escapeHtml(l.method || '') + '">' + escapeHtml(l.method || '') + '</td>';
        html += '<td class="text-sm text-muted">' + escapeHtml(l.ip || '-') + '</td>';
        html += '<td><span class="badge ' + (isErr ? 'badge-red' : 'badge-green') + '">' + escapeHtml(rs) + '</span></td>';
        html += '<td class="text-sm text-muted">' + (l.duration || 0) + 'ms</td>';
        html += '<td class="text-sm text-muted text-nowrap">' + (l.createdTime ? l.createdTime.substring(0, 19) : '-') + '</td></tr>';
    });
    tbody.innerHTML = html;
}

function renderPagination(total, page, ps) {
    var tp = Math.ceil(total / ps);
    var bar = document.getElementById('paginationBar');
    if (tp <= 1) { bar.innerHTML = '<span class="pagination-info">共 ' + total + ' 条</span>'; return; }
    var h = '<span class="pagination-info">共 ' + total + ' 条，第 ' + page + '/' + tp + ' 页</span><div class="pagination-btns">';
    h += '<button type="button" class="btn btn-sm btn-secondary" onclick="goPage(' + (page - 1) + ')" ' + (page <= 1 ? 'disabled' : '') + '>上一页</button>';
    for (var i = 1; i <= tp; i++) {
        if (tp <= 7 || i === 1 || i === tp || (i >= page - 1 && i <= page + 1)) {
            h += '<button type="button" class="btn btn-sm ' + (i === page ? 'btn-primary' : 'btn-secondary') + '" onclick="goPage(' + i + ')">' + i + '</button>';
        } else if (i === page - 2 || i === page + 2) {
            h += '<span class="pagination-ellipsis">...</span>';
        }
    }
    h += '<button type="button" class="btn btn-sm btn-secondary" onclick="goPage(' + (page + 1) + ')" ' + (page >= tp ? 'disabled' : '') + '>下一页</button></div>';
    bar.innerHTML = h;
}

function goPage(p) { currentPage = p; loadLogs(); }
function searchLogs() { currentPage = 1; loadLogs(); }

function showDetail(evt) {
    var cells = evt.currentTarget.querySelectorAll('td');
    if (cells.length < 9) return;
    var detail = {
        id: cells[0].textContent,
        username: (cells[1].querySelector('strong') || {}).textContent || '',
        module: (cells[2].querySelector('.badge') || {}).textContent || cells[2].textContent,
        operation: cells[3].textContent,
        method: cells[4].getAttribute('title') || cells[4].textContent,
        ip: cells[5].textContent,
        result: (cells[6].querySelector('.badge') || {}).textContent || cells[6].textContent,
        duration: cells[7].textContent,
        time: cells[8].textContent
    };
    var fields = [
        ['ID', detail.id], ['操作用户', detail.username], ['模块', detail.module],
        ['操作', detail.operation], ['方法', detail.method], ['IP地址', detail.ip],
        ['结果', detail.result], ['耗时', detail.duration], ['时间', detail.time]
    ];
    var html = '';
    fields.forEach(function(f) {
        html += '<div class="log-detail-item"><span class="log-detail-label">' + f[0] + '</span><span class="log-detail-value">' + escapeHtml(f[1] || '-') + '</span></div>';
    });
    document.getElementById('logDetailContent').innerHTML = html;
    openModal('detailModal');
}

function cleanOldLogs() {
    if (!confirm('确定要清理90天前的操作日志吗？此操作不可恢复。')) return;
    fetch('/admin/api/logs/clean?days=90', { method: 'DELETE' })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            showToast(d.message, d.success ? 'success' : 'error');
            if (d.success) loadLogs();
        });
}

function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

document.addEventListener('click', function(e) {
    if (e.target.classList.contains('modal-overlay')) e.target.style.display = 'none';
});

// Start loading
loadLogs();
</script>
</body>
</html>
