<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认订单 - 线上购物与交易系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .addr-card { border: 2px solid #eee; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; cursor: pointer; transition: all .2s; }
        .addr-card:hover { border-color: #667eea; }
        .addr-card.selected { border-color: #ff4757; background: #fff5f5; }
        .addr-new { border: 2px dashed #ddd; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; color: #666; margin-bottom: 10px; }
        .addr-new:hover { border-color: #667eea; color: #667eea; }
        .addr-form-inline { display: none; margin-top: 16px; padding: 16px; background: #fafafa; border-radius: 10px; }
        .addr-form-inline.show { display: block; }
        .addr-tag { font-size: 12px; padding: 1px 8px; border-radius: 8px; margin-left: 8px; }
    </style>
</head>
<body>
<div class="navbar desktop-nav">
    <div class="nav-container">
        <a href="/" class="nav-brand">线上购物与交易系统</a>
        <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <ul class="nav-menu">
            <li class="nav-item"><a href="/">首页</a></li>
            <li class="nav-item"><a href="/product/list">商品</a></li>
            <li class="nav-item"><a href="/cart/view">购物车</a></li>
            <li class="nav-item"><a href="/order/list">订单</a></li>
            <li class="nav-item"><a href="/address/list">收货地址</a></li>
        </ul>
    </div>
</div>

<div class="mobile-dropdown" id="mobileDropdown">
    <a href="/">首页</a>
    <a href="/product/list">商品</a>
    <a href="/cart/view">购物车</a>
    <a href="/order/list">订单</a>
    <a href="/address/list">收货地址</a>
    <a href="/exchange/market">以物易物</a>
    <a href="/logout">退出</a>
</div>

<div class="confirm-container">
    <h2>确认订单</h2>

    <!-- 收货信息 -->
    <div class="order-section">
        <h3>收货信息</h3>
        <div id="addressList"></div>
        <div class="addr-new" id="addrNewBtn" onclick="showNewAddrForm()">+ 使用新地址</div>

        <div class="addr-form-inline" id="addrForm">
            <div class="form-row">
                <div>
                    <label for="receiverName">收货人</label>
                    <input type="text" id="receiverName" placeholder="请输入收货人姓名">
                </div>
                <div>
                    <label for="receiverPhone">联系电话</label>
                    <input type="text" id="receiverPhone" placeholder="请输入手机号码">
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label for="region">所在地区</label>
                    <input type="text" id="region" placeholder="省/市/区">
                </div>
                <div>
                    <label>标签</label>
                    <div style="display:flex;gap:8px;height:42px;align-items:center;">
                        <label><input type="radio" name="addrLabel" value="家"> 家</label>
                        <label><input type="radio" name="addrLabel" value="公司"> 公司</label>
                        <label><input type="radio" name="addrLabel" value="学校"> 学校</label>
                    </div>
                </div>
            </div>
            <div class="form-row full">
                <label for="detailAddr">详细地址</label>
                <input type="text" id="detailAddr" placeholder="街道、楼栋、门牌号">
            </div>
            <div style="display:flex;gap:8px;margin-top:8px;">
                <button class="btn btn-primary" style="font-size:13px;padding:6px 16px;" onclick="saveNewAddr(event)">保存并选用</button>
                <button class="btn btn-secondary" style="font-size:13px;padding:6px 16px;" onclick="hideNewAddrForm(event)">取消</button>
            </div>
        </div>

        <div class="form-row full" style="margin-top:12px;">
            <label for="remark">订单备注（可选）</label>
            <textarea id="remark" rows="3" placeholder="如有特殊要求，请在此备注"></textarea>
        </div>
    </div>

    <!-- 商品信息 -->
    <div class="order-section">
        <h3>商品信息</h3>
        <table>
            <thead>
                <tr>
                    <th>商品</th>
                    <th>单价</th>
                    <th>数量</th>
                    <th>小计</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cart : ${carts}">
                    <td>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <img th:if="${cart.product.imageUrl}" th:src="${cart.product.imageUrl}" class="item-img" alt="">
                            <div th:if="${!cart.product.imageUrl}" class="item-img" style="background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; color: white; font-size: 24px;">📦</div>
                            <span th:text="${cart.product.name}">商品名称</span>
                        </div>
                    </td>
                    <td>¥<span th:text="${#numbers.formatDecimal(cart.product.price, 1, 2)}">0.00</span></td>
                    <td th:text="${cart.quantity}">1</td>
                    <td><strong>¥<span th:text="${#numbers.formatDecimal(cart.product.price * cart.quantity, 1, 2)}">0.00</span></strong></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 金额汇总 -->
    <div class="summary">
        <div class="row">
            <span>商品总额</span>
            <span>¥<span id="displayTotal" th:text="${#numbers.formatDecimal(totalAmount, 1, 2)}">0.00</span></span>
        </div>
        <div class="row">
            <span>运费</span>
            <span>免运费</span>
        </div>
        <div class="row" style="border-top:1px solid #ddd;padding-top:15px;margin-top:10px;">
            <span style="font-size:18px;font-weight:bold;">实付金额</span>
            <span class="total">¥<span id="displayActual" th:text="${#numbers.formatDecimal(totalAmount, 1, 2)}">0.00</span></span>
        </div>
    </div>

    <div class="btn-group">
        <a href="javascript:history.back()" class="btn-back">返回购物车</a>
        <button class="btn-submit" onclick="submitOrder()">提交订单</button>
    </div>
</div>

<script>
    var selectedCartIds = [];
    var selectedAddressId = null;

    // 加载地址列表
    document.addEventListener('DOMContentLoaded', function() {
        loadAddresses();
        var menu = document.getElementById('mobileDropdown');
        if (menu) {
            document.addEventListener('click', function(e) {
                if (e.target.closest('.hamburger-btn')) return;
                if (!e.target.closest('.mobile-dropdown')) menu.classList.remove('show');
            });
        }
    });

    function loadAddresses() {
        fetch('/address/select-json')
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res.success && res.data && res.data.length > 0) {
                renderAddresses(res.data);
            }
        });
    }

    function renderAddresses(list) {
        var html = '';
        list.forEach(function(addr) {
            var tag = '';
            if (addr.isDefault == 1) tag += '<span class="addr-tag" style="background:#ff4757;color:white;">默认</span>';
            else if (addr.label) tag += '<span class="addr-tag" style="background:#f0f4ff;color:#667eea;">' + addr.label + '</span>';
            html += '<div class="addr-card" data-id="' + addr.id + '" onclick="selectAddr(' + addr.id + ')">' +
                '<div style="display:flex;align-items:center;margin-bottom:4px;">' +
                '<strong>' + addr.receiverName + '</strong> ' +
                '<span style="color:#666;margin-left:10px;">' + addr.receiverPhone + '</span>' +
                tag +
                '</div>' +
                '<div style="color:#999;font-size:13px;">' + (addr.region || '') + ' ' + (addr.detailAddress || '') + '</div>' +
                '</div>';
        });
        document.getElementById('addressList').innerHTML = html;

        // 自动选中默认地址
        var def = list.find(function(a) { return a.isDefault == 1; });
        if (def) selectAddr(def.id);
    }

    function selectAddr(id) {
        selectedAddressId = id;
        document.querySelectorAll('.addr-card').forEach(function(c) {
            c.classList.toggle('selected', c.dataset.id == id);
        });
        // 隐藏新增表单
        document.getElementById('addrForm').classList.remove('show');
        document.getElementById('addrNewBtn').style.display = 'block';
    }

    function showNewAddrForm() {
        document.getElementById('addrForm').classList.add('show');
        document.getElementById('addrNewBtn').style.display = 'none';
        selectedAddressId = null;
        document.querySelectorAll('.addr-card').forEach(function(c) { c.classList.remove('selected'); });
    }

    function hideNewAddrForm(e) {
        if (e) e.preventDefault();
        document.getElementById('addrForm').classList.remove('show');
        document.getElementById('addrNewBtn').style.display = 'block';
    }

    function saveNewAddr(e) {
        e.preventDefault();
        var data = {
            receiverName: document.getElementById('receiverName').value.trim(),
            receiverPhone: document.getElementById('receiverPhone').value.trim(),
            region: document.getElementById('region').value.trim(),
            detailAddress: document.getElementById('detailAddr').value.trim(),
            label: document.querySelector('input[name="addrLabel"]:checked')?.value || '',
            isDefault: 0
        };
        if (!data.receiverName || !data.receiverPhone || !data.region || !data.detailAddress) {
            alert('请完整填写地址信息'); return;
        }
        fetch('/address/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'receiverName=' + encodeURIComponent(data.receiverName) +
                  '&receiverPhone=' + encodeURIComponent(data.receiverPhone) +
                  '&region=' + encodeURIComponent(data.region) +
                  '&detailAddress=' + encodeURIComponent(data.detailAddress) +
                  '&label=' + encodeURIComponent(data.label) +
                  '&isDefault=0'
        })
        .then(function(r) { return r.text(); })
        .then(function() {
            loadAddresses();
            document.getElementById('addrForm').classList.remove('show');
            document.getElementById('addrNewBtn').style.display = 'block';
            // 清空表单
            document.getElementById('receiverName').value = '';
            document.getElementById('receiverPhone').value = '';
            document.getElementById('region').value = '';
            document.getElementById('detailAddr').value = '';
        });
    }

    function submitOrder() {
        var shippingAddress = '';
        var receiverName = '';
        var receiverPhone = '';

        if (selectedAddressId) {
            var card = document.querySelector('.addr-card.selected');
            if (card) {
                var lines = card.innerHTML.split('<br>');
                var nameLine = card.querySelector('strong');
                var phoneSpan = card.querySelector('span[style*="color:#666"]');
                receiverName = nameLine ? nameLine.textContent.trim() : '';
                receiverPhone = phoneSpan ? phoneSpan.textContent.trim() : '';
                // Build full address from the card text
                var addrDiv = card.querySelector('div[style*="color:#999"]');
                shippingAddress = addrDiv ? addrDiv.textContent.trim() : '';
            }
        } else {
            receiverName = document.getElementById('receiverName').value.trim();
            receiverPhone = document.getElementById('receiverPhone').value.trim();
            var region = document.getElementById('region').value.trim();
            var detailAddr = document.getElementById('detailAddr').value.trim();
            shippingAddress = (region + ' ' + detailAddr).trim();
        }

        if (!receiverName) { alert('请输入收货人姓名'); return; }
        if (!receiverPhone) { alert('请输入联系电话'); return; }
        if (!shippingAddress) { alert('请输入收货地址'); return; }

        var items = [];
        document.querySelectorAll('tbody tr').forEach(function(row) {
            var cells = row.querySelectorAll('td');
            if (cells.length >= 4) {
                var productLink = cells[0].querySelector('span:last-child');
                var priceText = cells[1].textContent.replace('¥', '');
                var qty = parseInt(cells[2].textContent);
                // Try to get product ID from the image alt or data attribute
                items.push({
                    productId: 0,
                    productName: productLink ? productLink.textContent.trim() : '',
                    price: parseFloat(priceText),
                    quantity: qty
                });
            }
        });

        var totalAmount = parseFloat(document.getElementById('displayTotal').textContent);

        var requestData = {
            totalAmount: totalAmount,
            actualAmount: totalAmount,
            shippingFee: 0,
            discountAmount: 0,
            shippingAddress: shippingAddress,
            receiverName: receiverName,
            receiverPhone: receiverPhone,
            remark: document.getElementById('remark').value.trim(),
            items: items,
            cartIds: selectedCartIds
        };

        var btn = document.querySelector('.btn-submit');
        btn.disabled = true;
        btn.textContent = '提交中...';

        fetch('/order/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestData)
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.success) {
                alert('订单创建成功！');
                window.location.href = '/order/list';
            } else {
                alert('订单创建失败：' + data.message);
                btn.disabled = false;
                btn.textContent = '提交订单';
            }
        })
        .catch(function(err) {
            alert('网络错误，请重试');
            btn.disabled = false;
            btn.textContent = '提交订单';
        });
    }

    function toggleMobileMenu() {
        var menu = document.getElementById('mobileDropdown');
        if (menu) menu.classList.toggle('show');
    }
</script>

<div class="mobile-bottom-nav">
    <div class="nav-items">
        <a href="/" class="nav-item"><span class="nav-icon">🏠</span><span>首页</span></a>
        <a href="/product/list" class="nav-item"><span class="nav-icon">📦</span><span>商品</span></a>
        <a href="/cart/view" class="nav-item"><span class="nav-icon">🛒</span><span>购物车</span></a>
        <a href="/order/list" class="nav-item"><span class="nav-icon">📋</span><span>订单</span></a>
        <a href="/" class="nav-item"><span class="nav-icon">👤</span><span>我的</span></a>
    </div>
</div>
</body>
</html>
