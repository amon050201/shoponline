<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 线上购物与交易系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="chinese-login">

<div class="ink-bg">
    <div class="ink-wash ink-wash-1"></div>
    <div class="ink-wash ink-wash-2"></div>
    <div class="ink-wash ink-wash-3"></div>
</div>

<div class="chinese-card-wrapper">
    <div class="chinese-card">
        <div class="chinese-seal">&#21360;</div>
        <h2 class="chinese-title">欢迎回来</h2>

        <div th:if="${session.message}" class="chinese-alert" th:classappend="${session.messageType == 'success' ? 'alert-success' : 'alert-error'}">
            <span th:text="${session.message}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="chinese-input-group">
                <span class="chinese-input-icon">&#9671;</span>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="chinese-input-group">
                <span class="chinese-input-icon">&#9679;</span>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <div class="chinese-input-group">
                <span class="chinese-input-icon">&#9641;</span>
                <input type="text" id="captcha" name="captcha" class="captcha-input" placeholder="验证码" required maxlength="4">
                <img src="/captcha" alt="验证码" class="chinese-captcha" id="captchaImage" title="点击刷新">
            </div>

            <button type="submit" class="chinese-btn">登&emsp;录</button>
        </form>

        <div class="chinese-footer">
            <a th:href="@{/register}">尚无账号，立即注册</a>
            <span class="chinese-divider">|</span>
            <a th:href="@{/}">返回首页</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('captchaImage').addEventListener('click', function() {
        this.src = '/captcha?' + new Date().getTime();
    });
    document.getElementById('username').focus();
</script>

</body>
</html>
