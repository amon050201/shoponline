<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product != null ? product.name : '商品详情'} + ' - 在线购物系统'">商品详情</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="navbar desktop-nav">
        <div class="nav-container">
            <a href="/" class="nav-brand">线上购物与交易系统</a>
            <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
            <ul class="nav-menu">
                <li class="nav-item"><a th:href="@{/product/list}">返回首页</a></li>
                <li class="nav-item"><a th:href="@{/cart/view}">购物车</a></li>
                <li class="nav-item"><a th:href="@{/order/list}">我的订单</a></li>
                <li class="nav-item"><a th:href="@{/address/list}">收货地址</a></li>
        </div>
    </div>

    <!-- 移动端顶部栏 -->
    <div class="mobile-top-bar">
        <button type="button" class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <span class="page-title">商品详情</span>
        <a href="/cart/view" class="right-action">🛒</a>
    </div>

    <!-- 移动端下拉菜单 -->
    <div class="mobile-dropdown" id="mobileDropdown">
        <a href="/">首页</a>
        <a href="/product/list">商品列表</a>
        <a href="/cart/view">购物车</a>
        <a href="/order/list">我的订单</a>
        <a href="/exchange/market">以物易物</a>
        <a href="/logout">退出登录</a>
    </div>

    <div class="container">
        <div th:if="${product != null}" class="product-detail">
            <div class="product-main">
                <div class="product-image-section">
                    <img th:src="${product.imageUrl != null ? product.imageUrl : '/images/default-product.svg'}"
                         alt="商品图片" class="product-main-image" onerror="this.src='/images/default-product.svg'">
                </div>

                <div class="product-info-section">
                    <h1 class="product-title" th:text="${product.name}">商品名称</h1>

                    <div class="product-price-box">
                        <div class="price-label">促销价</div>
                        <div>
                            <span class="current-price">¥<span th:text="${product.price}">0.00</span></span>
                            <span th:if="${product.originalPrice != null}" class="original-price">
                                ¥<span th:text="${product.originalPrice}">0.00</span>
                            </span>
                        </div>
                    </div>

                    <div class="product-meta-info">
                        <div class="meta-item">
                            <span class="meta-label">品牌</span>
                            <span class="meta-value" th:text="${product.brand != null ? product.brand : '未知'}">品牌</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">分类</span>
                            <span class="meta-value" th:text="${product.categoryName != null ? product.categoryName : '未分类'}">分类</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">库存</span>
                            <span class="meta-value">
                                <span th:text="${product.stock}">0</span>
                                <span th:class="${product.stock > 0 ? 'stock-status in-stock' : 'stock-status out-of-stock'}"
                                      th:text="${product.stock > 0 ? '有货' : '缺货'}">状态</span>
                            </span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">销量</span>
                            <span class="meta-value" th:text="${product.salesCount} + ' 件'">销量</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">浏览</span>
                            <span class="meta-value" th:text="${product.viewCount} + ' 次'">浏览量</span>
                        </div>
                    </div>

                    <div class="quantity-selector">
                        <span class="quantity-label">数量</span>
                        <div class="quantity-controls">
                            <button class="quantity-btn" onclick="decreaseQuantity()">-</button>
                            <input type="number" id="quantity" class="quantity-input" value="1" min="1"
                                   th:max="${product.stock}" readonly>
                            <button class="quantity-btn" onclick="increaseQuantity()"
                                    th:disabled="${product.stock <= 0}">+</button>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn-add-cart" th:onclick="'addToCart(' + ${product.id} + ')'"
                                th:disabled="${product.stock <= 0}">
                            加入购物车
                        </button>
                        <button class="btn-buy-now" th:disabled="${product.stock <= 0}">
                            立即购买
                        </button>
                    </div>
                </div>
            </div>

            <div class="product-description">
                <h2 class="description-title">商品详情</h2>
                <div class="description-content" th:text="${product.description != null ? product.description : '暂无详细描述'}">
                    商品描述
                </div>
            </div>

            <!-- AI价格预测 -->
            <div class="recommend-section" id="ai-price-section" style="display:none;">
                <h2 class="recommend-title">AI 价格预测 <span style="font-size:14px;color:#999;font-weight:normal;" id="price-confidence"></span></h2>
                <div style="background:#f8f9fa;border-radius:8px;padding:20px;">
                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:15px;">
                        <div style="text-align:center;padding:15px;background:white;border-radius:8px;">
                            <div style="font-size:12px;color:#999;">7天后预测</div>
                            <div style="font-size:22px;font-weight:bold;color:#ff6700;" id="predicted-7d">-</div>
                        </div>
                        <div style="text-align:center;padding:15px;background:white;border-radius:8px;">
                            <div style="font-size:12px;color:#999;">30天后预测</div>
                            <div style="font-size:22px;font-weight:bold;color:#ff6700;" id="predicted-30d">-</div>
                        </div>
                        <div style="text-align:center;padding:15px;background:white;border-radius:8px;">
                            <div style="font-size:12px;color:#999;">90天后预测</div>
                            <div style="font-size:22px;font-weight:bold;color:#ff6700;" id="predicted-90d">-</div>
                        </div>
                    </div>
                    <div id="price-trend" style="font-size:13px;color:#666;text-align:center;"></div>
                </div>
            </div>

            <!-- AI估值按钮 -->
            <div class="recommend-section">
                <button onclick="aiValuation()" style="width:100%;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;">
                    🤖 AI智能估值
                </button>
                <div id="ai-valuation-result" style="margin-top:15px;display:none;"></div>
            </div>

            <!-- 以物易物入口 -->
            <div class="recommend-section">
                <a th:href="@{/exchange/request/{id}(id=${product.id})}" style="display:block;text-align:center;padding:12px;background:linear-gradient(135deg,#fa709a,#fee140);color:white;text-decoration:none;border-radius:8px;font-size:16px;font-weight:bold;">
                    🔄 以物易物 - 发起交换
                </a>
            </div>

            <!-- 买了又买推荐 -->
            <div class="recommend-section">
                <h2 class="recommend-title">买了又买</h2>
                <div class="recommend-grid" id="also-bought-grid">
                    <div style="color:#999;">加载中...</div>
                </div>
            </div>

            <!-- 相似商品推荐 -->
            <div class="recommend-section">
                <h2 class="recommend-title">相似推荐</h2>
                <div class="recommend-grid" id="similar-grid">
                    <div style="color:#999;">加载中...</div>
                </div>
            </div>
        </div>

        <div th:if="${product == null}" style="text-align: center; padding: 60px 20px; color: #999;">
            <h2>商品不存在</h2>
            <p><a th:href="@{/product/list}" style="color: #ff6700;">返回商品列表</a></p>
        </div>
    </div>

    <script>
        function toggleMobileMenu() {
            var menu = document.getElementById('mobileDropdown');
            if (menu) menu.classList.toggle('show');
        }
        document.addEventListener('DOMContentLoaded', function() {
            var menu = document.getElementById('mobileDropdown');
            if (!menu) return;
            document.addEventListener('click', function(e) {
                if (e.target.closest('.hamburger-btn')) return;
                if (!e.target.closest('.mobile-dropdown')) menu.classList.remove('show');
            });
        });

        const productId = [[${product != null ? product.id : 0}]];

        function increaseQuantity() {
            const input = document.getElementById('quantity');
            const max = parseInt(input.getAttribute('max'));
            const current = parseInt(input.value);
            if (current < max) {
                input.value = current + 1;
            }
        }

        function decreaseQuantity() {
            const input = document.getElementById('quantity');
            const current = parseInt(input.value);
            if (current > 1) {
                input.value = current - 1;
            }
        }

        function addToCart(productId) {
            const quantity = parseInt(document.getElementById('quantity').value);

            fetch('/cart/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    productId: productId,
                    quantity: quantity
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('添加成功！');
                } else {
                    alert(data.message || '添加失败，请先登录');
                    if (data.message && data.message.includes('登录')) {
                        window.location.href = '/login';
                    }
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('添加失败');
            });
        }

        // 加载"买了又买"推荐
        if (productId) {
            fetch('/api/recommend/also-bought/' + productId + '?limit=6')
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.data && data.data.length > 0) {
                        renderRecommend('also-bought-grid', data.data);
                    } else {
                        document.getElementById('also-bought-grid').innerHTML = '';
                        document.querySelector('.recommend-section').style.display = 'none';
                    }
                })
                .catch(() => {});

            // 加载相似推荐
            fetch('/api/recommend/similar/' + productId + '?limit=6')
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.data && data.data.length > 0) {
                        renderRecommend('similar-grid', data.data);
                    } else {
                        document.getElementById('similar-grid').innerHTML = '';
                    }
                })
                .catch(() => {});
        }

        // AI价格预测
        if (productId) {
            fetch('/api/ai/price/predict/' + productId + '?forecastDays=90')
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.data) {
                        var p = data.data;
                        document.getElementById('ai-price-section').style.display = 'block';
                        document.getElementById('predicted-7d').textContent = '¥' + (p.predictedPrice7d || 0);
                        document.getElementById('predicted-30d').textContent = '¥' + (p.predictedPrice30d || 0);
                        document.getElementById('predicted-90d').textContent = '¥' + (p.predictedPrice90d || 0);
                        document.getElementById('price-confidence').textContent = '可信度: ' + Math.round((p.confidence || 0) * 100) + '%';
                        var trendText = '趋势: ';
                        if (p.trend === 'up') trendText += '📈 上涨';
                        else if (p.trend === 'down') trendText += '📉 下跌';
                        else trendText += '➡️ 平稳';
                        document.getElementById('price-trend').textContent = trendText;
                    }
                })
                .catch(function() {});
        }

        // AI估值
        function aiValuation() {
            var resultDiv = document.getElementById('ai-valuation-result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div style="text-align:center;color:#999;">AI正在分析商品信息...</div>';
            fetch('/api/ai/valuation/evaluate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ productId: productId, scenario: 'sale' })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success && data.data) {
                    var v = data.data;
                    resultDiv.innerHTML =
                        '<div style="background:#f0f4ff;border-radius:8px;padding:20px;">' +
                        '<h3 style="margin-bottom:15px;color:#667eea;">AI估值报告</h3>' +
                        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
                        '<div><span style="color:#999;">估值:</span> <strong style="color:#e74c3c;font-size:18px;">¥' + (v.estimatedValue || 0) + '</strong></div>' +
                        '<div><span style="color:#999;">成色:</span> <strong>' + (v.condition || 'good') + '</strong></div>' +
                        '<div><span style="color:#999;">市场区间:</span> <strong>¥' + (v.marketRangeLow || 0) + ' - ¥' + (v.marketRangeHigh || 0) + '</strong></div>' +
                        '</div>' +
                        '<div style="margin-top:10px;padding:10px;background:white;border-radius:6px;font-size:13px;color:#666;">' + (v.marketAnalysis || '') + '</div>' +
                        (v.recommendation ? '<div style="margin-top:8px;padding:10px;background:#fff8e1;border-radius:6px;font-size:13px;color:#f57f17;">💡 ' + v.recommendation + '</div>' : '') +
                        '</div>';
                } else {
                    resultDiv.innerHTML = '<div style="text-align:center;color:#999;">估值服务暂不可用</div>';
                }
            })
            .catch(function() {
                resultDiv.innerHTML = '<div style="text-align:center;color:#e74c3c;">估值请求失败</div>';
            });
        }

        function renderRecommend(containerId, products) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = products.map(p => {
                const id = p.id || p.product_id || 0;
                const name = p.name || '';
                const price = p.price || 0;
                const img = p.image_url || p.imageUrl || '';
                return '<a href="/product/detail/' + id + '" class="recommend-item">' +
                    '<img class="recommend-img" src="' + img + '" alt="' + name + '" onerror="this.style.display=\'none\'">' +
                    '<div class="recommend-name">' + name + '</div>' +
                    '<div class="recommend-price">¥' + price + '</div>' +
                    '</a>';
            }).join('');
        }
    </script>

    <!-- 移动端底部导航 -->
    <div class="mobile-bottom-nav">
        <div class="nav-items">
            <a href="/" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>首页</span>
            </a>
            <a href="/product/list" class="nav-item">
                <span class="nav-icon">📦</span>
                <span>商品</span>
            </a>
            <a href="/cart/view" class="nav-item">
                <span class="nav-icon">🛒</span>
                <span>购物车</span>
            </a>
            <a href="/order/list" class="nav-item">
                <span class="nav-icon">📋</span>
                <span>订单</span>
            </a>
            <a href="/profile" class="nav-item">
                <span class="nav-icon">👤</span>
                <span>我的</span>
            </a>
        </div>
    </div>
</body>
</html>
