<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑用户 - 线上购物与交易系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar desktop-nav">
    <div class="nav-container">
        <a th:href="@{/}" class="nav-brand">线上购物与交易系统</a>
        <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <ul class="nav-menu">
            <li class="nav-item"><a th:href="@{/}">首页</a></li>
            <li class="nav-item"><a th:href="@{/userlist}">用户管理</a></li>
            <li class="nav-item"><a th:href="@{/admin/dashboard}">控制台</a></li>
            <li class="nav-item"><a th:href="@{/logout}">退出</a></li>
        </ul>
    </div>
</div>

<div class="mobile-dropdown" id="mobileDropdown">
    <a href="/">首页</a>
    <a href="/userlist">用户管理</a>
    <a href="/admin/dashboard">控制台</a>
    <a href="/product/list">商品</a>
    <a href="/order/list">订单</a>
    <a href="/logout">退出</a>
</div>

<div class="container">
    <h2>编辑用户</h2>

    <div th:if="${success}" style="padding: 12px; border-radius: 4px; margin-bottom: 20px; text-align: center; font-weight: bold; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;" th:text="${success}"></div>
    <div th:if="${error}" style="padding: 12px; border-radius: 4px; margin-bottom: 20px; text-align: center; font-weight: bold; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;" th:text="${error}"></div>

    <form th:action="@{/updateUser}" method="post">
        <input type="hidden" name="id" th:value="${user.id}" />
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" th:value="${user.username}" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label for="password">新密码</label>
            <input type="password" id="password" name="password" placeholder="留空则不修改密码">
            <div class="hint">留空则保留原密码</div>
        </div>
        <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" th:value="${user.email}" placeholder="请输入邮箱">
        </div>
        <div class="form-group">
            <label for="phone">手机号</label>
            <input type="tel" id="phone" name="phone" th:value="${user.phone}" placeholder="请输入手机号">
        </div>
        <div class="button-group">
            <button type="submit" class="btn-primary">保存修改</button>
            <button type="button" class="btn-secondary" onclick="window.location.href='/userlist'">返回列表</button>
        </div>
    </form>
</div>

<script>
    function toggleMobileMenu() {
        var menu = document.getElementById('mobileDropdown');
        if (menu) menu.classList.toggle('show');
    }
    document.addEventListener('DOMContentLoaded', function() {
        var menu = document.getElementById('mobileDropdown');
        if (!menu) return;
        document.addEventListener('click', function(e) {
            if (e.target.closest('.hamburger-btn')) return;
            if (!e.target.closest('.mobile-dropdown')) menu.classList.remove('show');
        });
    });
</script>

<div class="mobile-bottom-nav">
    <div class="nav-items">
        <a href="/" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>首页</span>
        </a>
        <a href="/userlist" class="nav-item">
            <span class="nav-icon">👥</span>
            <span>用户</span>
        </a>
        <a href="/product/list" class="nav-item">
            <span class="nav-icon">📦</span>
            <span>商品</span>
        </a>
        <a href="/order/list" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>订单</span>
        </a>
        <a href="/admin/dashboard" class="nav-item">
            <span class="nav-icon">📊</span>
            <span>控制台</span>
        </a>
    </div>
</div>

<div class="footer">
    &copy; 2026 线上购物与交易系统. All rights reserved.
</div>
</body>
</html>
