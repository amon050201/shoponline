<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 线上购物与交易系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">&#9709;</div>
            <h2>欢迎回来</h2>
            <p>登录您的账户继续购物</p>
        </div>

        <div th:if="${session.message}" class="alert" th:classappend="${session.messageType == 'success' ? 'alert-success' : 'alert-error'}">
            <span th:text="${session.message}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="input-group">
                <span class="input-icon">&#9633;</span>
                <input type="text" id="username" name="username" placeholder="用户名" required autofocus>
            </div>
            <div class="input-group">
                <span class="input-icon">&#9679;</span>
                <input type="password" id="password" name="password" placeholder="密码" required>
            </div>
            <div class="input-group">
                <span class="input-icon">&#9645;</span>
                <input type="text" id="captcha" name="captcha" class="captcha-input" placeholder="验证码" required maxlength="4">
                <img src="/captcha" alt="验证码" class="captcha-img" id="captchaImage" title="点击刷新验证码">
            </div>

            <button type="submit" class="login-btn">登 录</button>
        </form>

        <div class="login-footer">
            <a th:href="@{/register}">还没有账号？立即注册</a>
            <a th:href="@{/}">返回首页</a>
        </div>
    </div>

    <div class="login-copyright">&copy; 2026 线上购物与交易系统</div>
</div>

<script>
    document.getElementById('captchaImage').addEventListener('click', function() {
        this.src = '/captcha?' + new Date().getTime();
    });
    document.getElementById('username').focus();
</script>

</body>
</html>
