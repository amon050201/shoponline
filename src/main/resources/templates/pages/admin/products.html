<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 - 管理后台</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="admin-layout">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="admin-sidebar" id="adminSidebar">
        <a href="/admin/dashboard" class="sidebar-brand"><span class="brand-dot"></span>管理后台</a>
        <div class="sidebar-user">
            <div class="avatar" th:text="${username != null ? #strings.substring(username, 0, 1) : 'A'}">A</div>
            <div class="user-info"><div class="user-name" th:text="${username}">管理员</div><div class="user-role">系统管理员</div></div>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-section">主导航</div>
            <a href="/admin/dashboard"><span class="nav-icon">&#9632;</span>控制台</a>
            <a href="/admin/users"><span class="nav-icon">&#9633;</span>用户管理</a>
            <a href="/admin/products" class="active"><span class="nav-icon">&#9651;</span>商品管理</a>
            <a href="/admin/logs"><span class="nav-icon">&#9645;</span>操作日志</a>
            <div class="sidebar-section" style="margin-top:12px;">快捷入口</div>
            <a href="/order/list"><span class="nav-icon">&#9644;</span>订单管理</a>
            <a href="/test"><span class="nav-icon">&#9673;</span>系统测试</a>
        </nav>
        <div class="sidebar-footer"><a href="/">&#8592; 返回前台</a></div>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="菜单">&#9776;</button>
                <div class="breadcrumb"><span class="current">商品管理</span></div>
            </div>
            <div class="topbar-right">
                <span style="font-size:13px;color:var(--admin-text-muted);" th:text="'欢迎，' + ${username}">欢迎，管理员</span>
                <a href="/logout" class="topbar-btn danger"><span>&#10149;</span> <span>退出登录</span></a>
            </div>
        </header>
        <main class="admin-content">

    <div class="page-header"><h1>商品管理</h1><p>管理系统中所有商品信息，支持添加、编辑和删除。</p></div>

    <div class="admin-card" style="margin-bottom:16px;"><div class="admin-card-body" style="padding:16px 20px;">
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="search-box">
                    <input type="text" id="searchKeyword" placeholder="搜索商品名称..." onkeyup="if(event.key==='Enter')loadProducts()">
                    <button type="button" class="btn btn-primary" onclick="loadProducts()">搜索</button>
                </div>
            </div>
            <div class="toolbar-right">
                <button type="button" class="btn btn-primary" onclick="showAddModal()">+ 添加商品</button>
            </div>
        </div>
    </div></div>

    <div class="admin-card"><div class="admin-card-body no-padding"><div class="admin-table-wrap">
        <table class="admin-table">
            <thead><tr><th>ID</th><th>名称</th><th>价格</th><th>库存</th><th>分类ID</th><th>品牌</th><th>状态</th><th>销量</th><th>操作</th></tr></thead>
            <tbody id="productTableBody"><tr><td colspan="9"><div class="loading-text">加载中...</div></td></tr></tbody>
        </table>
    </div></div></div>

    <div class="pagination-bar" id="paginationBar"></div>

        </main>
    </div>
</div>

<!-- Product Modal -->
<div class="modal-overlay" id="productModal">
    <div class="modal-card" style="max-width:560px;">
        <div class="modal-header"><h3 id="productModalTitle">添加商品</h3><button type="button" class="modal-close" onclick="closeModal('productModal')">&times;</button></div>
        <div class="modal-body">
            <input type="hidden" id="editProductId">
            <div class="admin-form-group"><label>商品名称 <span style="color:#ef4444;">*</span></label><input type="text" id="productName" placeholder="请输入商品名称"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="admin-form-group"><label>价格 <span style="color:#ef4444;">*</span></label><input type="number" id="productPrice" placeholder="0.00" step="0.01" min="0"></div>
                <div class="admin-form-group"><label>原价</label><input type="number" id="productOrigPrice" placeholder="0.00" step="0.01" min="0"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="admin-form-group"><label>库存</label><input type="number" id="productStock" placeholder="0" min="0"></div>
                <div class="admin-form-group"><label>分类ID</label><input type="number" id="productCategory" placeholder="1-6" min="1" max="6"></div>
            </div>
            <div class="admin-form-group"><label>品牌</label><input type="text" id="productBrand" placeholder="请输入品牌（选填）"></div>
            <div class="admin-form-group"><label>描述</label><textarea id="productDesc" rows="3" placeholder="请输入商品描述（选填）"></textarea></div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModal('productModal')">取消</button>
            <button type="button" class="btn btn-primary" id="productSaveBtn" onclick="saveProduct()">确认</button>
        </div>
    </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirmModal">
    <div class="modal-card" style="max-width:400px;">
        <div class="modal-header"><h3>确认操作</h3><button type="button" class="modal-close" onclick="closeModal('confirmModal')">&times;</button></div>
        <div class="modal-body"><p id="confirmMsg" style="font-size:14px;color:var(--admin-text-secondary);"></p></div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeModal('confirmModal')">取消</button><button type="button" class="btn btn-danger" id="confirmBtn">确认</button></div>
    </div>
</div>

<script>
function toggleSidebar(){var s=document.getElementById('adminSidebar'),o=document.getElementById('sidebarOverlay');if(s&&o){s.classList.toggle('open');o.classList.toggle('show')}}
function closeSidebar(){var s=document.getElementById('adminSidebar'),o=document.getElementById('sidebarOverlay');if(s&&o){s.classList.remove('open');o.classList.remove('show')}}
document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('.sidebar-nav a').forEach(function(l){l.addEventListener('click',function(){if(window.innerWidth<=768)closeSidebar()})})});

var currentPage=1,pageSize=10,isEdit=false;

function showToast(msg,type){type=type||'info';var t=document.createElement('div');t.className='admin-toast '+type;t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.classList.add('hide');t.addEventListener('animationend',function(){t.remove()})},2500)}
function openModal(id){document.getElementById(id).style.display='flex'}
function closeModal(id){document.getElementById(id).style.display='none'}

function loadProducts(){
    var kw=document.getElementById('searchKeyword').value.trim();
    var params='?page='+currentPage+'&pageSize='+pageSize;
    if(kw)params+='&keyword='+encodeURIComponent(kw);
    fetch('/admin/api/products'+params).then(function(r){return r.json()}).then(function(d){
        if(!d.success){showToast(d.message||'加载失败','error');return}
        renderTable(d.data.products);renderPagination(d.data.total,d.data.page,d.data.pageSize)
    }).catch(function(){showToast('网络错误','error')})
}

function renderTable(products){
    var tbody=document.getElementById('productTableBody');
    if(!products||products.length===0){tbody.innerHTML='<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#9651;</div><p>暂无商品数据</p></div></td></tr>';return}
    var html='';
    products.forEach(function(p){
        html+='<tr><td>'+p.id+'</td><td><strong>'+escapeHtml(p.name)+'</strong></td>';
        html+='<td>&#165;'+(p.price||0)+'</td><td>'+(p.stock||0)+'</td><td>'+(p.categoryId||'-')+'</td>';
        html+='<td>'+escapeHtml(p.brand||'-')+'</td>';
        html+='<td><span class="status-dot '+(p.status===1?'active':'inactive')+'"></span>'+(p.status===1?'上架':'下架')+'</td>';
        html+='<td>'+(p.salesCount||0)+'</td>';
        html+='<td class="action-cell"><button type="button" class="btn btn-sm btn-primary" onclick="showEditModal('+p.id+')">编辑</button> <button type="button" class="btn btn-sm btn-danger" onclick="confirmDelete('+p.id+',\''+escapeHtml(p.name)+'\')">删除</button></td></tr>'
    });
    tbody.innerHTML=html
}

function renderPagination(total,page,ps){
    var tp=Math.ceil(total/ps),bar=document.getElementById('paginationBar');
    if(tp<=1){bar.innerHTML='';return}
    var h='<span class="pagination-info">共 '+total+' 条，第 '+page+'/'+tp+' 页</span><div class="pagination-btns">';
    h+='<button type="button" class="btn btn-sm btn-secondary" onclick="goPage('+(page-1)+')" '+(page<=1?'disabled':'')+'>上一页</button>';
    for(var i=1;i<=tp;i++){
        if(tp<=7||i===1||i===tp||(i>=page-1&&i<=page+1))h+='<button type="button" class="btn btn-sm '+(i===page?'btn-primary':'btn-secondary')+'" onclick="goPage('+i+')">'+i+'</button>';
        else if(i===page-2||i===page+2)h+='<span class="pagination-ellipsis">...</span>'
    }
    h+='<button type="button" class="btn btn-sm btn-secondary" onclick="goPage('+(page+1)+')" '+(page>=tp?'disabled':'')+'>下一页</button></div>';
    bar.innerHTML=h
}
function goPage(p){currentPage=p;loadProducts()}

function showAddModal(){
    isEdit=false;
    document.getElementById('productModalTitle').textContent='添加商品';
    document.getElementById('productSaveBtn').textContent='确认添加';
    document.getElementById('editProductId').value='';document.getElementById('productName').value='';
    document.getElementById('productPrice').value='';document.getElementById('productOrigPrice').value='';
    document.getElementById('productStock').value='';document.getElementById('productCategory').value='';
    document.getElementById('productBrand').value='';document.getElementById('productDesc').value='';
    openModal('productModal')
}

function showEditModal(id){
    isEdit=true;
    document.getElementById('productModalTitle').textContent='编辑商品';
    document.getElementById('productSaveBtn').textContent='保存修改';
    fetch('/admin/api/products?page=1&pageSize=100').then(function(r){return r.json()}).then(function(d){
        if(!d.success)return;
        var p=d.data.products.find(function(x){return x.id===id});
        if(!p)return;
        document.getElementById('editProductId').value=p.id;document.getElementById('productName').value=p.name||'';
        document.getElementById('productPrice').value=p.price||'';document.getElementById('productOrigPrice').value=p.originalPrice||'';
        document.getElementById('productStock').value=p.stock||'';document.getElementById('productCategory').value=p.categoryId||'';
        document.getElementById('productBrand').value=p.brand||'';document.getElementById('productDesc').value=p.description||'';
        openModal('productModal')
    })
}

function saveProduct(){
    var data={
        name:document.getElementById('productName').value.trim(),
        price:parseFloat(document.getElementById('productPrice').value)||0,
        originalPrice:parseFloat(document.getElementById('productOrigPrice').value)||null,
        stock:parseInt(document.getElementById('productStock').value)||0,
        categoryId:parseInt(document.getElementById('productCategory').value)||null,
        brand:document.getElementById('productBrand').value.trim(),
        description:document.getElementById('productDesc').value.trim(),
        status:1
    };
    if(!data.name){showToast('请输入商品名称','error');return}
    if(!data.price||data.price<=0){showToast('请输入有效价格','error');return}
    var url,method;
    if(isEdit){data.id=parseInt(document.getElementById('editProductId').value);url='/admin/api/products/'+data.id;method='PUT'}
    else{url='/admin/api/products';method='POST'}
    fetch(url,{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
        .then(function(r){return r.json()}).then(function(d){
            showToast(d.message,d.success?'success':'error');
            if(d.success){closeModal('productModal');loadProducts()}
        })
}

function confirmDelete(id,name){
    document.getElementById('confirmMsg').textContent='确定要删除商品 "'+name+'" 吗？此操作不可恢复。';
    document.getElementById('confirmBtn').onclick=function(){
        fetch('/admin/api/products/'+id,{method:'DELETE'}).then(function(r){return r.json()}).then(function(d){
            showToast(d.message,d.success?'success':'error');if(d.success)loadProducts();closeModal('confirmModal')
        })
    };openModal('confirmModal')
}

function escapeHtml(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML}
document.addEventListener('click',function(e){if(e.target.classList.contains('modal-overlay'))e.target.style.display='none'});
loadProducts();
</script>
</body>
</html>
