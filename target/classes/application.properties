# 服务器配置
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/

# Spring 配置
spring.application.name=springboot-mybatis-login

# 数据源配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/demo1_db?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Thymeleaf 配置
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# 日志配置
logging.level.com.qzy.springbootlogin=DEBUG
logging.level.org.springframework.web=INFO

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.qzy.springbootlogin.pojo
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# AI Provider Configuration
ai.active-provider=tongyi
ai.tongyi.api-key=your-dashscope-api-key
ai.tongyi.model=qwen-plus
ai.tongyi.vision-model=qwen-vl-plus
ai.wenxin.api-key=your-baidu-api-key
ai.wenxin.secret-key=your-baidu-secret-key
ai.wenxin.model=ernie-4.0-8k

# Elasticsearch 配置
spring.elasticsearch.enabled=false
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=10s

# Cache 配置 (开发环境用 simple，生产环境用 redis)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
spring.cache.type=simple
# spring.cache.type=redis
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.data.redis.timeout=3000ms
# spring.cache.redis.time-to-live=300000
# spring.cache.redis.key-prefix=demo1:
# spring.cache.redis.cache-null-values=false

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# RabbitMQ 配置 (连接失败时静默降级，不影响主业务流程)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.connection-timeout=1000
spring.rabbitmq.template.retry.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.simple.retry.enabled=false

# Payment Gateway (演示模式)
payment.demo-mode=true
# 生产环境配置真实密钥:
