<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发起交换 - 线上购物与交易系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>发起交换请求</h1>
        </div>

        <div class="content">
            <div class="card">
                <div class="card-title">您想要的商品</div>
                <div class="product-info">
                    <div class="product-name" th:text="${targetProduct.name}">商品名称</div>
                    <div class="product-price">¥<span th:text="${targetProduct.price}">0.00</span></div>
                    <div id="target-valuation" style="margin-top:10px;padding:8px;background:#f0f4ff;border-radius:6px;font-size:13px;display:none;"></div>
                </div>

                <div class="form-group">
                    <label>您的收货地址</label>
                    <input type="text" id="receiverAddress" placeholder="请输入您的收货地址">
                </div>

                <div class="form-group">
                    <label>备注信息（可选）</label>
                    <textarea id="remark" rows="3" placeholder="请输入备注信息"></textarea>
                </div>
            </div>

            <div class="card">
                <div class="card-title">选择您要交换的商品</div>

                <div class="form-group">
                    <label>从以下商品中选择</label>
                    <select id="myProductId">
                        <option value="">请选择商品</option>
                        <option th:each="product : ${myProducts}"
                                th:value="${product.id}"
                                th:text="${product.name + ' (¥' + product.price + ')'}">
                            商品名称
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>对方收货地址</label>
                    <input type="text" id="initiatorAddress" placeholder="请输入对方的收货地址">
                </div>

                <div id="my-valuation" style="margin-top:10px;padding:8px;background:#f0f4ff;border-radius:6px;font-size:13px;display:none;"></div>

                <div id="recommended-diff" style="margin-top:10px;padding:10px;background:#fff8e1;border-radius:6px;font-size:14px;display:none;text-align:center;font-weight:bold;"></div>

                <div class="price-diff" id="priceDiffBox" style="display: none;">
                    <h3>差价计算（按标价）</h3>
                    <div class="amount" id="priceDiffAmount">¥0.00</div>
                    <p id="priceDiffText">选择商品后自动计算</p>
                </div>

                <button class="btn-submit" onclick="submitExchange()">提交交换请求</button>
                <a href="/exchange/market" class="btn-back">返回市场</a>
            </div>
        </div>
    </div>

    <script>
        const targetPrice = [[${targetProduct.price}]];
        const targetProductId = [[${targetProduct.id}]];
        const receiverId = [[${targetProduct.merchantId}]] || 1;
        let aiValuations = {};

        document.getElementById('myProductId').addEventListener('change', function() {
            calculatePriceDiff();
            loadAiValuation();
        });

        // 获取目标商品AI估值
        fetch('/exchange/valuation/' + targetProductId)
            .then(r => r.json())
            .then(data => {
                if (data.success && data.data) {
                    aiValuations.target = data.data;
                    displayAiValuation('target-valuation', data.data);
                }
            }).catch(() => {});

        function loadAiValuation() {
            const myProductId = document.getElementById('myProductId').value;
            if (!myProductId) return;
            fetch('/exchange/valuation/' + myProductId)
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.data) {
                        aiValuations.mine = data.data;
                        displayAiValuation('my-valuation', data.data);
                        loadRecommendedDiff();
                    }
                }).catch(() => {});
        }

        function displayAiValuation(elementId, data) {
            const el = document.getElementById(elementId);
            if (!el || !data) return;
            el.style.display = 'block';
            el.innerHTML = 'AI估值: <strong style="color:#667eea;">¥' + (data.estimatedValue || 0) + '</strong> ' +
                '<span style="font-size:12px;color:#999;">(市场: ¥' + (data.marketRangeLow || 0) + ' - ¥' + (data.marketRangeHigh || 0) + ')</span>';
        }

        function loadRecommendedDiff() {
            const myProductId = document.getElementById('myProductId').value;
            if (!myProductId) return;
            fetch('/exchange/recommended-diff/' + myProductId + '/' + targetProductId)
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.data !== undefined) {
                        const diff = parseFloat(data.data);
                        const el = document.getElementById('recommended-diff');
                        el.style.display = 'block';
                        if (diff > 0) {
                            el.innerHTML = '🤖 AI推荐: 您应补差价 <strong style="color:#e74c3c;">¥' + diff.toFixed(2) + '</strong>';
                        } else if (diff < 0) {
                            el.innerHTML = '🤖 AI推荐: 对方应补您差价 <strong style="color:#27ae60;">¥' + Math.abs(diff).toFixed(2) + '</strong>';
                        } else {
                            el.innerHTML = '🤖 AI推荐: 等价交换，无需补差价';
                        }
                    }
                }).catch(() => {});
        }

        function calculatePriceDiff() {
            const myProductId = document.getElementById('myProductId').value;
            if (!myProductId) {
                document.getElementById('priceDiffBox').style.display = 'none';
                return;
            }
            const select = document.getElementById('myProductId');
            const selectedOption = select.options[select.selectedIndex];
            const text = selectedOption.text;
            const match = text.match(/¥([\d.]+)/);
            if (match) {
                const myPrice = parseFloat(match[1]);
                const diff = targetPrice - myPrice;
                document.getElementById('priceDiffBox').style.display = 'block';
                if (diff > 0) {
                    document.getElementById('priceDiffAmount').textContent = '¥' + diff.toFixed(2);
                    document.getElementById('priceDiffText').textContent = '您需要补给对方 ¥' + diff.toFixed(2);
                } else if (diff < 0) {
                    document.getElementById('priceDiffAmount').textContent = '¥' + Math.abs(diff).toFixed(2);
                    document.getElementById('priceDiffText').textContent = '对方需要补给您 ¥' + Math.abs(diff).toFixed(2);
                } else {
                    document.getElementById('priceDiffAmount').textContent = '¥0.00';
                    document.getElementById('priceDiffText').textContent = '等价交换，无需补差价';
                }
            }
        }

        async function submitExchange() {
            const myProductId = document.getElementById('myProductId').value;
            const receiverAddress = document.getElementById('receiverAddress').value;
            const initiatorAddress = document.getElementById('initiatorAddress').value;
            const remark = document.getElementById('remark').value;
            if (!myProductId) { alert('请选择要交换的商品'); return; }
            if (!receiverAddress) { alert('请填写您的收货地址'); return; }
            if (!initiatorAddress) { alert('请填写对方的收货地址'); return; }
            const orderData = {
                receiverId: receiverId,
                initiatorProductId: parseInt(myProductId),
                receiverProductId: targetProductId,
                initiatorAddress: initiatorAddress,
                receiverAddress: receiverAddress,
                remark: remark
            };
            try {
                const response = await fetch('/exchange/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                const result = await response.json();
                if (result.code === 200) {
                    alert(result.message);
                    window.location.href = '/exchange/my-orders';
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('提交失败，请重试');
            }
        }
    </script>

    <div class="mobile-bottom-nav">
        <div class="nav-items">
            <a href="/" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>首页</span>
            </a>
            <a href="/product/list" class="nav-item">
                <span class="nav-icon">📦</span>
                <span>商品</span>
            </a>
            <a href="/cart/view" class="nav-item">
                <span class="nav-icon">🛒</span>
                <span>购物车</span>
            </a>
            <a href="/order/list" class="nav-item">
                <span class="nav-icon">📋</span>
                <span>订单</span>
            </a>
            <a href="/exchange/market" class="nav-item">
                <span class="nav-icon">🔄</span>
                <span>交换</span>
            </a>
        </div>
    </div>
</body>
</html>
