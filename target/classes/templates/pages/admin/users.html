<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 管理后台</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar desktop-nav">
    <div class="nav-container">
        <a href="/" class="nav-brand">线上购物与交易系统</a>
        <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <ul class="nav-menu">
            <li class="nav-item"><a href="/admin/dashboard">管理后台</a></li>
            <li class="nav-item active"><a href="/admin/users">用户管理</a></li>
            <li class="nav-item"><a href="/product/list">商品管理</a></li>
            <li class="nav-item"><a href="/logout">退出</a></li>
        </ul>
    </div>
</div>

<!-- 移动端下拉菜单 -->
<div class="mobile-dropdown" id="mobileDropdown">
    <a href="/">首页</a>
    <a href="/admin/dashboard">管理后台</a>
    <a href="/admin/users">用户管理</a>
    <a href="/product/list">商品管理</a>
    <a href="/logout">退出</a>
</div>

<div class="container">
    <h2>用户管理</h2>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="stat-number" th:text="${#lists.size(users)}">0</div>
            <div class="stat-label">总用户数</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" th:text="${#lists.size(users.^[?#this.roleType == 0])}">0</div>
            <div class="stat-label">顾客</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" th:text="${#lists.size(users.^[?#this.roleType == 1])}">0</div>
            <div class="stat-label">商家</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" th:text="${#lists.size(users.^[?#this.roleType == 2])}">0</div>
            <div class="stat-label">管理员</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>邮箱</th>
                <th>手机号</th>
                <th>角色</th>
                <th>状态</th>
                <th>注册时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.username}">admin</td>
                <td th:text="${user.email}">-</td>
                <td th:text="${user.phone}">-</td>
                <td>
                    <span th:if="${user.roleType == 0}" class="role-badge role-customer">顾客</span>
                    <span th:if="${user.roleType == 1}" class="role-badge role-merchant">商家</span>
                    <span th:if="${user.roleType == 2}" class="role-badge role-admin">管理员</span>
                </td>
                <td>
                    <span th:if="${user.status == 1}" class="status-active">启用</span>
                    <span th:if="${user.status == 0}" class="status-disabled">禁用</span>
                </td>
                <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</td>
                <td>
                    <select class="role-select" th:attr="onchange='updateRole(' + ${user.id} + ', this.value)'">
                        <option value="0" th:selected="${user.roleType == 0}">顾客</option>
                        <option value="1" th:selected="${user.roleType == 1}">商家</option>
                        <option value="2" th:selected="${user.roleType == 2}">管理员</option>
                    </select>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    function updateRole(userId, roleType) {
        if (!confirm('确认修改该用户的角色吗？')) return;
        fetch('/admin/user/role?userId=' + userId + '&roleType=' + roleType, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) {
                alert('角色更新成功');
                location.reload();
            } else {
                alert('更新失败：' + data.message);
                location.reload();
            }
        });
    }

    function toggleMobileMenu() {
        var menu = document.getElementById('mobileDropdown');
        if (menu) menu.classList.toggle('show');
    }
    document.addEventListener('DOMContentLoaded', function() {
        var menu = document.getElementById('mobileDropdown');
        if (!menu) return;
        document.addEventListener('click', function(e) {
            if (e.target.closest('.hamburger-btn')) return;
            if (!e.target.closest('.mobile-dropdown')) menu.classList.remove('show');
        });
    });
</script>

<!-- 移动端底部导航 -->
<div class="mobile-bottom-nav">
    <div class="nav-items">
        <a href="/" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>首页</span>
        </a>
        <a href="/admin/dashboard" class="nav-item">
            <span class="nav-icon">📊</span>
            <span>控制台</span>
        </a>
        <a href="/admin/users" class="nav-item active">
            <span class="nav-icon">👥</span>
            <span>用户</span>
        </a>
        <a href="/product/list" class="nav-item">
            <span class="nav-icon">📦</span>
            <span>商品</span>
        </a>
        <a href="/order/list" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>订单</span>
        </a>
    </div>
</div>
</body>
</html>
