<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- Background Glow Effect -->
<div class="glow-effect"></div>

<!-- Floating Background Shapes -->
<div class="floating-shapes">
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
    <span class="shape"></span>
</div>

<!-- 移动端顶部栏 -->
<div class="mobile-top-bar">
    <a href="/" class="back-btn">←</a>
    <span class="page-title">用户登录</span>
    <a href="/register" class="right-action">注册</a>
</div>

<div class="form-container">
    <h2>🔐 用户登录</h2>

    <!-- Session message display -->
    <div th:if="${session.message}" th:class="${'message ' + session.messageType}" th:text="${session.message}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">👤 用户名</label>
            <input type="text" id="username" name="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label for="password">🔑 密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码" required>
        </div>
        <div class="form-group">
            <label for="captcha">🛡️ 验证码</label>
            <div class="captcha-group">
                <input type="text" id="captcha" name="captcha" class="captcha-input" placeholder="请输入验证码" required maxlength="4">
                <img src="/captcha" alt="验证码" class="captcha-image" id="captchaImage" title="点击刷新验证码">
            </div>
        </div>
        <div class="button-group">
            <button type="submit" class="btn-primary">登录</button>
            <button type="reset" class="btn-secondary">重置</button>
        </div>
        <div class="register-link">
            <a th:href="@{/register}">还没有账号？立即注册</a>
        </div>
    </form>
</div>

<div class="footer">
    &copy; 2026 线上购物与交易系统. All rights reserved. |
    <a href="#">隐私政策</a> |
    <a href="#">服务条款</a>
</div>

<!-- 移动端底部导航 -->
<div class="mobile-bottom-nav">
    <div class="nav-items">
        <a href="/" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>首页</span>
        </a>
        <a href="/product/list" class="nav-item">
            <span class="nav-icon">📦</span>
            <span>商品</span>
        </a>
        <a href="/login" class="nav-item active">
            <span class="nav-icon">👤</span>
            <span>登录</span>
        </a>
    </div>
</div>

<script>
    document.getElementById('captchaImage').addEventListener('click', function() {
        this.src = '/captcha?' + new Date().getTime();
    });
    document.getElementById('username').focus();

    // 移动端下拉菜单切换
    document.addEventListener('DOMContentLoaded', function() {
        var hamburger = document.querySelector('.hamburger-btn');
        var dropdown = document.querySelector('.mobile-dropdown');
        if (hamburger && dropdown) {
            hamburger.addEventListener('click', function() {
                dropdown.classList.toggle('show');
            });
            document.addEventListener('click', function(e) {
                if (!hamburger.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove('show');
                }
            });
        }
    });
</script>

</body>
</html>
