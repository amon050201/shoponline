<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>我的 - 线上购物系统</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar desktop-nav"><div class="nav-container">
  <a href="/" class="nav-brand">线上购物系统</a>
  <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
  <ul class="nav-menu">
    <li class="nav-item"><a href="/">首页</a></li>
    <li class="nav-item"><a href="/product/list">商品</a></li>
    <li class="nav-item" th:if="${roleType != 1}"><a href="/cart/view">购物车</a></li>
    <li class="nav-item" th:if="${roleType != 1}"><a href="/order/list">订单</a></li>
    <li class="nav-item" th:if="${roleType == 1}"><a href="/merchant/dashboard">商家中心</a></li>
    <li class="nav-item" th:if="${roleType == 2}"><a href="/admin/dashboard">管理后台</a></li>
    <li class="nav-item"><a href="/logout">退出</a></li>
  </ul>
</div></div>

<div class="page-container" style="max-width:600px;">
  <div style="text-align:center;padding:40px 0;">
    <div style="font-size:80px;">👤</div>
    <h2 th:text="${username}" style="margin:10px 0;">用户名</h2>
    <span class="role-badge" th:if="${roleType == 0}" style="background:#e3f2fd;color:#1565c0;padding:4px 16px;border-radius:12px;">顾客</span>
    <span class="role-badge" th:if="${roleType == 1}" style="background:#fff3e0;color:#e65100;padding:4px 16px;border-radius:12px;">商家</span>
    <span class="role-badge" th:if="${roleType == 2}" style="background:#fce4ec;color:#c62828;padding:4px 16px;border-radius:12px;">管理员</span>
  </div>

  <div class="card" style="display:flex;justify-content:space-around;text-align:center;">
    <a href="/order/list" style="text-decoration:none;color:#333;"><div style="font-size:36px;">📋</div><div>我的订单</div></a>
    <a href="/address/list" style="text-decoration:none;color:#333;"><div style="font-size:36px;">📍</div><div>收货地址</div></a>
    <a href="/cart/view" style="text-decoration:none;color:#333;" th:if="${roleType != 1}"><div style="font-size:36px;">🛒</div><div>购物车</div></a>
    <a href="/exchange/market" style="text-decoration:none;color:#333;"><div style="font-size:36px;">🔄</div><div>以物易物</div></a>
  </div>

  <div style="margin-top:20px;" th:if="${roleType == 1}">
    <a href="/merchant/dashboard" class="btn btn-primary btn-block">🏪 进入商家中心</a>
  </div>
  <div style="margin-top:20px;" th:if="${roleType == 2}">
    <a href="/admin/dashboard" class="btn btn-primary btn-block" style="background:linear-gradient(135deg,#c62828,#ef5350);">⚙️ 进入管理后台</a>
  </div>

  <div style="margin-top:30px;text-align:center;">
    <a href="/logout" class="btn btn-ghost">退出登录</a>
  </div>
</div>

<div class="mobile-bottom-nav"><div class="nav-items">
  <a href="/" class="nav-item"><span>🏠</span><span>首页</span></a>
  <a href="/product/list" class="nav-item"><span>📦</span><span>商品</span></a>
  <a href="/cart/view" class="nav-item" th:if="${roleType != 1}"><span>🛒</span><span>购物车</span></a>
  <a href="/order/list" class="nav-item" th:if="${roleType != 1}"><span>📋</span><span>订单</span></a>
  <a href="/profile" class="nav-item active"><span>👤</span><span>我的</span></a>
</div></div>
<script>
function toggleMobileMenu(){var m=document.getElementById('mobileDropdown');if(m)m.classList.toggle('show')}
</script>
</body>
</html>
