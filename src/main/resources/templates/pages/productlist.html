<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品列表 - 在线购物系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="navbar desktop-nav">
        <div class="nav-container">
            <a href="/" class="nav-brand">线上购物与交易系统</a>
            <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
            <div class="search-box">
                <form th:action="@{/product/search}" method="get" id="searchForm">
                    <input type="text" name="keyword" id="searchKeyword" placeholder="搜索商品..." th:value="${keyword}">
                    <button type="submit">搜索</button>
                </form>
            </div>
            <ul class="nav-menu">
                <li class="nav-item"><a th:href="@{/product/list}">首页</a></li>
                <li class="nav-item"><a th:href="@{/cart/view}">购物车</a></li>
                <li class="nav-item"><a th:href="@{/order/list}">我的订单</a></li>
                <li class="nav-item"><a th:href="@{/address/list}">收货地址</a></li>
                <li class="nav-item"><a th:href="@{/}">个人中心</a></li>
            </ul>
        </div>
    </div>

    <!-- 移动端顶部栏 -->
    <div class="mobile-top-bar">
        <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <span class="page-title">商品列表</span>
        <a href="/cart/view" class="right-action">🛒</a>
    </div>

    <!-- 移动端下拉菜单 -->
    <div class="mobile-dropdown" id="mobileDropdown">
        <a href="/">首页</a>
        <a href="/product/list">商品列表</a>
        <a href="/cart/view">购物车</a>
        <a href="/order/list">我的订单</a>
        <a href="/exchange/market">以物易物</a>
        <a href="/logout">退出登录</a>
    </div>
    
    <div class="container">
        <div class="category-filter">
            <h3>商品分类</h3>
            <a th:href="@{/product/list}" th:class="${categoryId == null and keyword == null ? 'active' : ''}">全部</a>
            <a th:href="@{/product/category/1}">电子产品</a>
            <a th:href="@{/product/category/2}">家居用品</a>
            <a th:href="@{/product/category/3}">服装鞋帽</a>
            <a th:href="@{/product/category/4}">图书文具</a>
            <a th:href="@{/product/category/5}">运动户外</a>
            <a th:href="@{/product/category/6}">美妆护肤</a>
        </div>

        <div th:if="${keyword != null}" class="category-filter" style="background: #fff5f0;">
            <h3>搜索结果: <span style="color:#ff6700;" th:text="|『${keyword}』|">keyword</span></h3>
            <span style="font-size:14px;color:#999;">找到 <strong th:text="${products != null ? products.size() : 0}">0</strong> 个相关商品</span>
            <a th:href="@{/product/list}" style="margin-left:20px;font-size:14px;color:#ff6700;">清除搜索</a>
        </div>
        
        <div th:if="${products != null and !products.empty}" class="product-grid">
            <div th:each="product : ${products}" class="product-card">
                <img th:src="${product.imageUrl != null ? product.imageUrl : '/images/default-product.svg'}"
                     alt="商品图片" class="product-image" onerror="this.src='/images/default-product.svg'"
                     onclick="window.location.href='/product/detail/' + [[${product.id}]]">
                <div class="product-info">
                    <div class="product-name" th:text="${product.name}">商品名称</div>
                    <div class="product-price">
                        ¥<span th:text="${product.price}">0.00</span>
                        <span th:if="${product.originalPrice != null}" class="product-original-price">
                            ¥<span th:text="${product.originalPrice}">0.00</span>
                        </span>
                    </div>
                    <div class="product-meta">
                        <span>销量: <span th:text="${product.salesCount}">0</span></span>
                        <span>库存: <span th:text="${product.stock}">0</span></span>
                    </div>
                    <button class="add-to-cart-btn" th:onclick="'addToCart(' + ${product.id} + ')'">
                        加入购物车
                    </button>
                </div>
            </div>
        </div>
        
        <div th:if="${products == null or products.empty}" class="empty-tip">
            <h2>暂无商品</h2>
            <p>暂时没有找到相关商品</p>
        </div>
    </div>
    
    <script>
        function addToCart(productId) {
            fetch('/cart/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    productId: productId,
                    quantity: 1
                })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.code === 200) {
                    alert('添加成功！');
                } else {
                    alert(data.message || '添加失败，请先登录');
                    if (data.message && data.message.indexOf('登录') !== -1) {
                        window.location.href = '/login';
                    }
                }
            })
            .catch(function(error) {
                console.error('Error:', error);
                alert('添加失败');
            });
        }

        function toggleMobileMenu() {
            var menu = document.getElementById('mobileDropdown');
            menu.classList.toggle('show');
        }

        document.addEventListener('DOMContentLoaded', function() {
            var menu = document.getElementById('mobileDropdown');
            document.addEventListener('click', function(e) {
                if (e.target.closest('.hamburger-btn')) return;
                if (!e.target.closest('.mobile-dropdown')) {
                    menu.classList.remove('show');
                }
            });
        });
    </script>

    <!-- 移动端底部导航 -->
    <div class="mobile-bottom-nav">
        <div class="nav-items">
            <a href="/" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>首页</span>
            </a>
            <a href="/product/list" class="nav-item active">
                <span class="nav-icon">📦</span>
                <span>商品</span>
            </a>
            <a href="/cart/view" class="nav-item">
                <span class="nav-icon">🛒</span>
                <span>购物车</span>
            </a>
            <a href="/order/list" class="nav-item">
                <span class="nav-icon">📋</span>
                <span>订单</span>
            </a>
            <a href="/" class="nav-item">
                <span class="nav-icon">👤</span>
                <span>我的</span>
            </a>
        </div>
    </div>
</body>
</html>
