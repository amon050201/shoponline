# Test configuration
server.port=0

# DataSource - MySQL (must match main config for MyBatis XML compatibility)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/demo1_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useUnicode=true
spring.datasource.username=root
spring.datasource.password=root123

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.qzy.springbootlogin.pojo
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# Disable non-essential components
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

spring.elasticsearch.enabled=false
spring.cache.type=simple

# Payment
payment.demo-mode=true

# Suppress startup noise
logging.level.com.qzy.springbootlogin=WARN
logging.level.org.springframework=WARN
